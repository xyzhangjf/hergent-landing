<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Hergent ERP</title>
<style>
:root{
  --g0:#fff; --g50:#f7f8fa; --g100:#eef0f3; --g200:#dde1e6; --g300:#c3c9d1; --g400:#8e96a1; --g500:#5f6977; --g600:#3d4552; --g700:#252b34; --g800:#161a20; --g900:#0b0e11;
  --b50:#edf6ff; --b100:#d0e5ff; --b500:#2490ef; --b600:#1a6fc4; --b700:#13509a;
  --r50:#fff0f0; --r500:#e74c3c;
  --gn50:#eafaf1; --gn500:#27ae60; --gn600:#1e8449;
  --a50:#fef9e7; --a500:#f39c12;
  --rad:6px; --rad-lg:10px; --sh:0 1px 4px rgba(0,0,0,.06);
  --fs:13px; --fs-sm:12px; --fs-lg:15px; --fs-xl:18px; --fs-2xl:22px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif;background:var(--g50);color:var(--g700);font-size:var(--fs);line-height:1.5;-webkit-font-smoothing:antialiased}
input,select,textarea{font:inherit;padding:7px 11px;border:1px solid var(--g200);border-radius:var(--rad);background:var(--g0);color:var(--g700);transition:border-color .15s,box-shadow .15s}
input:focus,select:focus{outline:none;border-color:var(--b500);box-shadow:0 0 0 3px rgba(36,144,239,.1)}
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border:1px solid var(--g200);border-radius:var(--rad);background:var(--g0);color:var(--g600);font-size:var(--fs-sm);font-weight:500;cursor:pointer;white-space:nowrap;transition:all .12s;line-height:1.3}
.btn:hover{background:var(--g50);border-color:var(--g300)}
.btn-p{background:var(--b500);border-color:var(--b500);color:#fff}.btn-p:hover{background:var(--b600);border-color:var(--b600)}
.btn-d{background:var(--r500);border-color:var(--r500);color:#fff}.btn-d:hover{opacity:.9}
.btn-s{padding:4px 9px;font-size:11px}.btn-g{border:none;background:none;color:var(--g400);padding:4px 6px}.btn-g:hover{color:var(--g600);background:var(--g50)}
.badge{display:inline-flex;align-items:center;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.bg-dr{background:var(--g100);color:var(--g500)}.bg-act{background:var(--b50);color:var(--b600)}.bg-ok{background:var(--gn50);color:var(--gn600)}
.bg-war{background:var(--a50);color:var(--a500)}.bg-err{background:var(--r50);color:var(--r500)}.bg-inf{background:var(--b50);color:var(--b600)}

.login-page{display:flex;min-height:100vh;align-items:center;justify-content:center;background:linear-gradient(160deg,#f0f5fa 0%,#e8f0f8 50%,#f5f7fa 100%)}
.login-card{width:400px;padding:44px 40px;background:var(--g0);border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04)}
.login-card h1{font-size:20px;font-weight:700;color:var(--g800);text-align:center;margin-bottom:6px}
.login-card .sub{font-size:var(--fs-sm);color:var(--g400);text-align:center;margin-bottom:28px}
.login-card .fld{margin-bottom:14px}.login-card .fld label{display:block;font-size:var(--fs-sm);font-weight:600;color:var(--g500);margin-bottom:4px}
.login-card .fld input{width:100%;padding:10px 12px}.login-card .btn{width:100%;padding:10px;justify-content:center;font-size:var(--fs)}.login-err{font-size:var(--fs-sm);color:var(--r500);text-align:center;margin-top:10px;display:none}

.app{display:none;flex-direction:column;height:100vh}
.topbar{display:flex;align-items:center;justify-content:space-between;height:50px;padding:0 18px;background:var(--g0);border-bottom:1px solid var(--g100);flex-shrink:0;z-index:10}
.topbar .brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:var(--fs-lg);color:var(--g800)}
.topbar .brand .dot{width:8px;height:8px;border-radius:50%;background:var(--b500)}
.topbar .user{display:flex;align-items:center;gap:10px;font-size:var(--fs-sm);color:var(--g500)}
.topbar .user .av{width:30px;height:30px;border-radius:50%;background:var(--b50);color:var(--b600);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.app-body{display:flex;flex:1;overflow:hidden}

/* Sidebar — ERPNext Desk style */
.sidebar{width:210px;min-width:210px;background:var(--g0);border-right:1px solid var(--g100);overflow-y:auto;display:flex;flex-direction:column;flex-shrink:0}
.sidebar .mod{padding:2px 0}
.sidebar .mod-title{display:flex;align-items:center;gap:6px;padding:9px 16px 5px;font-size:10px;font-weight:700;color:var(--g400);text-transform:uppercase;letter-spacing:.6px;cursor:pointer}
.sidebar .mod-title:hover{color:var(--g600)}
.sidebar .mod-title .arr{font-size:8px;transition:transform .15s;color:var(--g300)}
.sidebar .mod.collapsed .mod-title .arr{transform:rotate(-90deg)}
.sidebar .mod.collapsed .mod-body{display:none}
.sidebar .mi{display:flex;align-items:center;gap:8px;padding:6px 16px 6px 28px;font-size:var(--fs-sm);color:var(--g500);cursor:pointer;transition:all .08s;border-left:2px solid transparent}
.sidebar .mi:hover{background:var(--g50);color:var(--g700)}
.sidebar .mi.active{background:var(--b50);color:var(--b600);font-weight:600;border-left-color:var(--b500)}
.sidebar .mi .mi-count{font-size:10px;background:var(--r500);color:#fff;padding:0 5px;border-radius:8px;margin-left:auto}

.main{flex:1;overflow-y:auto;background:var(--g50)}
.main-inner{padding:20px 24px;max-width:1400px}

.phead{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.phead h2{font-size:var(--fs-xl);font-weight:700;color:var(--g800)}
.pactions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}

/* Stat cards */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.stat{background:var(--g0);border:1px solid var(--g100);border-radius:var(--rad-lg);padding:16px 18px;box-shadow:var(--sh)}
.stat .sl{font-size:var(--fs-sm);color:var(--g400);font-weight:500;margin-bottom:6px}
.stat .sv{font-size:24px;font-weight:700;color:var(--g800);line-height:1.1}
.stat.income .sv{color:var(--gn600)}.stat.expense .sv{color:var(--r500)}.stat.ar .sv{color:var(--a500)}.stat.ap .sv{color:var(--b600)}

.accts{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.accts .ac{flex:1;min-width:120px;background:var(--g0);border:1px solid var(--g100);border-radius:var(--rad-lg);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;font-size:var(--fs-sm)}
.accts .ac .an{color:var(--g400)}.accts .ac .ab{font-weight:700;font-size:var(--fs-lg)}

/* Table */
.tbl{background:var(--g0);border:1px solid var(--g100);border-radius:var(--rad-lg);overflow:hidden}
.tbl .tbar{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--g100);background:var(--g50)}
.tbl .tbar input{flex:1;max-width:280px;background:var(--g50);font-size:var(--fs-sm)}
.tbl .tbar select{background:var(--g50);font-size:var(--fs-sm)}
.tbl table{width:100%;border-collapse:collapse}
.tbl th{padding:8px 14px;font-size:11px;font-weight:700;color:var(--g400);text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--g100);background:var(--g50);text-align:left;position:sticky;top:0}
.tbl td{padding:9px 14px;font-size:var(--fs-sm);border-bottom:1px solid var(--g50);color:var(--g600);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}.tbl tbody tr:hover td{background:var(--b50)}
.tbl .r{text-align:right}.tbl .mono{font-family:"SF Mono","Fira Code",monospace;font-size:11px;color:var(--g400)}.tbl .b{font-weight:600}
.tbl tbody tr{cursor:pointer}.empty{text-align:center;padding:56px 20px;color:var(--g300);font-size:var(--fs-sm)}.empty .em{font-size:36px;margin-bottom:8px}

/* Form */
.form{background:var(--g0);border:1px solid var(--g100);border-radius:var(--rad-lg);max-width:800px}
.form .fh{padding:14px 18px;border-bottom:1px solid var(--g100);font-weight:700;font-size:var(--fs);display:flex;align-items:center;gap:8px;color:var(--g800)}
.form .fb{padding:18px}.form .fg{margin-bottom:14px}.form .fg label{display:block;font-size:var(--fs-sm);font-weight:600;color:var(--g400);margin-bottom:4px}
.form .fg input,.form .fg select{width:100%}.form .fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form .fr3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.form .fa{padding-top:12px;display:flex;gap:8px;border-top:1px solid var(--g50)}
.items-head{display:grid;grid-template-columns:2fr 1fr 1fr 36px;gap:8px;margin-bottom:6px;font-size:10px;font-weight:700;color:var(--g300);text-transform:uppercase}
.item-row{display:grid;grid-template-columns:2fr 1fr 1fr 36px;gap:8px;margin-bottom:6px;align-items:start}

/* Detail */
.detail{background:var(--g0);border:1px solid var(--g100);border-radius:var(--rad-lg);max-width:850px}
.detail .dh{padding:14px 18px;border-bottom:1px solid var(--g100);display:flex;justify-content:space-between;align-items:center}
.detail .dh .dht{font-weight:700;font-size:var(--fs)}.detail .db{padding:18px}
.detail .dm{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;margin-bottom:18px}
.detail .dm .mi .ml{font-size:10px;color:var(--g300);text-transform:uppercase;letter-spacing:.3px}.detail .dm .mi .mv{font-weight:600;margin-top:2px}
.detail table{width:100%;border-collapse:collapse;margin-bottom:16px}.detail td{padding:8px 0;border-bottom:1px solid var(--g50);font-size:var(--fs-sm)}
.detail table th{text-align:left;font-size:10px;color:var(--g400);text-transform:uppercase;padding-bottom:6px;border-bottom:1px solid var(--g100)}

.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:10px 22px;border-radius:20px;font-size:var(--fs-sm);font-weight:600;z-index:9999;opacity:0;transition:opacity .2s;box-shadow:0 4px 16px rgba(0,0,0,.12)}.toast.on{opacity:1}.toast.ok{background:var(--g800);color:#fff}.toast.er{background:var(--r500);color:#fff}

@media(max-width:768px){.stats{grid-template-columns:repeat(2,1fr)}.sidebar{width:56px;min-width:56px}.sidebar .mod-title span,.sidebar .mi span,.sidebar .mi-count,.sidebar .mod-title .arr{display:none}.sidebar .mi{justify-content:center;padding:8px}.detail .dm{grid-template-columns:1fr 1fr}.form .fr,.form .fr3{grid-template-columns:1fr}}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginPage" class="login-page">
  <div class="login-card">
    <h1>Hergent ERP</h1>
    <div class="sub">进销存管理系统</div>
    <div class="fld"><label>用户名</label><input id="loginUser" autocomplete="username" placeholder="admin"></div>
    <div class="fld"><label>密码</label><input id="loginPass" type="password" autocomplete="current-password" placeholder="admin123"></div>
    <button class="btn btn-p" onclick="doLogin()" id="loginBtn">登 录</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<!-- APP -->
<div class="app" id="appPage">
  <div class="topbar">
    <div class="brand"><span class="dot"></span> Hergent ERP</div>
    <div class="user" style="cursor:pointer" onclick="doLogout()"><span id="appUser"></span><span class="av" id="appAv"></span></div>
  </div>
  <div class="app-body">
    <nav class="sidebar" id="sidebar"></nav>
    <main class="main"><div class="main-inner" id="mainContent"></div></main>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// ============================================================
let T='', U=null, tab='dashboard';
const S={draft:'草稿',received:'已入库',delivered:'已出库',signed:'已签收',settled:'已结清',cancelled:'已取消',unpaid:'未结',partial:'部分结',paid:'已结',pending:'待交',submitted:'已交',confirmed:'已确认'};
const ICO={dashboard:'📊',sale:'📝',purchase:'📦',inventory:'🏪',payments:'💳',prepay:'🏦',expense:'📋',writeoff:'🔄',settlement:'📮',contacts:'👥',bills:'💰',users:'⚙️'};
const MODULES=[
  {title:'业务管理',open:true,items:[
    {id:'dashboard',label:'经营看板'},
    {id:'sale',label:'销售管理'},
    {id:'purchase',label:'采购管理'},
    {id:'inventory',label:'库存管理'},
  ]},
  {title:'资金管理',open:true,items:[
    {id:'payments',label:'收付款记录'},
    {id:'prepay',label:'预收预付款'},
    {id:'expense',label:'费用管理'},
    {id:'writeoff',label:'核销管理'},
    {id:'settlement',label:'员工交账'},
  ]},
  {title:'基础资料',open:true,items:[
    {id:'contacts',label:'客户供应商'},
    {id:'bills',label:'应收应付'},
  ]},
];
if(U?.role==='admin') MODULES.push({title:'系统设置',open:true,items:[{id:'users',label:'用户管理'}]});

function Y(v){return '¥'+(parseFloat(v)||0).toFixed(2)}

// ============================================================
async function api(p,o={}){
  const h={'Content-Type':'application/json'}; if(T) h['Authorization']='Bearer '+T;
  try{const r=await fetch('/api'+p,{headers:h,...o,body:o.body?JSON.stringify(o.body):undefined});if(r.status===401){T='';localStorage.removeItem('erp_token');location.reload();return null}return r.json()}catch(e){return null}
}
function toast(m,t){const e=document.getElementById('toast');e.textContent=m;e.className='toast '+(t||'ok')+' on';setTimeout(()=>e.classList.remove('on'),2200)}

// ============================================================
async function doLogin(){
  const u=document.getElementById('loginUser').value.trim(),p=document.getElementById('loginPass').value.trim();
  if(!u||!p)return;
  const btn=document.getElementById('loginBtn');btn.textContent='登录中...';btn.disabled=true;
  const errEl=document.getElementById('loginErr');errEl.style.display='none';
  try{
    const resp=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
    const r=await resp.json();
    if(r.success){T=r.token;U=r.user;localStorage.setItem('erp_token',T);initApp()}else{errEl.textContent=r.detail||'用户名或密码错误';errEl.style.display='block'}
  }catch(e){errEl.textContent='网络错误，请重试';errEl.style.display='block'}
  btn.textContent='登 录';btn.disabled=false;
}

async function initApp(){
  document.getElementById('loginPage').style.display='none';document.getElementById('appPage').style.display='flex';
  document.getElementById('appUser').textContent=U.display_name||U.username;
  document.getElementById('appAv').textContent=(U.display_name||U.username)[0];
  // 管理员加系统设置模块
  if(U.role==='admin'&&!MODULES.find(m=>m.title==='系统设置'))MODULES.push({title:'系统设置',open:true,items:[{id:'users',label:'用户管理'}]});
  renderSidebar();navigate('dashboard');
}

function renderSidebar(){
  document.getElementById('sidebar').innerHTML=MODULES.map(m=>`
    <div class="mod${m.open?'':' collapsed'}">
      <div class="mod-title" onclick="this.parentElement.classList.toggle('collapsed')"><span class="arr">▼</span><span>${m.title}</span></div>
      <div class="mod-body">${m.items.map(i=>`<div class="mi${tab===i.id?' active':''}" onclick="navigate('${i.id}')">${ICO[i.id]||''} <span>${i.label}</span></div>`).join('')}</div>
    </div>`).join('');
  document.getElementById('sidebar').insertAdjacentHTML('beforeend',`<div style="margin-top:auto;padding:6px 0;border-top:1px solid var(--g100)"><div class="mi" onclick="doLogout()" style="color:var(--g400)">🚪 <span>退出登录</span></div></div>`);
}

function navigate(t){tab=t;renderSidebar();Pages[t]?Pages[t]():navigate('dashboard')}

// ============================================================
const Pages={
  dashboard:async()=>{
    const d=await api('/dashboard');if(!d)return;
    document.getElementById('mainContent').innerHTML=`
      <div class="phead"><h2>经营看板</h2></div>
      <div class="stats"><div class="stat income"><div class="sl">今日收入</div><div class="sv">${Y(d.today_income)}</div></div>
      <div class="stat expense"><div class="sl">今日支出</div><div class="sv">${Y(d.today_expense)}</div></div>
      <div class="stat ar"><div class="sl">应收总额</div><div class="sv">${Y(d.total_ar)}</div></div>
      <div class="stat ap"><div class="sl">应付总额</div><div class="sv">${Y(d.total_ap)}</div></div></div>
      <div class="phead"><h3 style="font-size:var(--fs-lg);color:var(--g600)">账户余额</h3></div>
      <div class="accts">${(d.accounts||[]).map(a=>`<div class="ac"><span class="an">${a.name}</span><span class="ab">${Y(a.current_balance)}</span></div>`).join('')}</div>`;
  },

  sale:async()=>{
    const d=await api('/sale-orders?limit=300');const os=d?.orders||[];
    document.getElementById('mainContent').innerHTML=`
      <div class="phead"><h2>销售管理</h2><div class="pactions"><button class="btn btn-p" onclick="saleForm()">+ 开销售单</button></div></div>
      <div class="tbl"><div class="tbar"><input placeholder="搜索订单号 / 客户..." oninput="ft(this)"></div><table><thead><tr><th>订单号</th><th>客户</th><th>日期</th><th class="r">金额</th><th class="r">已收</th><th>状态</th></tr></thead><tbody>${os.map(o=>`<tr onclick="saleDetail(${o.id})"><td class="mono">${o.order_no}</td><td>${o.customer_name||'-'}</td><td>${o.order_date?.slice(0,10)}</td><td class="r b">${Y(o.total_amount)}</td><td class="r b">${Y(o.received_amount)}</td><td><span class="badge ${o.status==='draft'?'bg-dr':o.status==='delivered'?'bg-act':o.status==='cancelled'?'bg-err':'bg-ok'}">${S[o.status]}</span></td></tr>`).join('')||`<tr><td colspan="6"><div class="empty"><div class="em">📝</div><p>暂无销售单</p></div></td></tr>`}</tbody></table></div>`;
  },

  purchase:async()=>{
    const d=await api('/purchase-orders?limit=300');const os=d?.orders||[];
    document.getElementById('mainContent').innerHTML=`
      <div class="phead"><h2>采购管理</h2><div class="pactions"><button class="btn btn-p" onclick="purForm()">+ 采购入库</button></div></div>
      <div class="tbl"><table><thead><tr><th>订单号</th><th>供应商</th><th>日期</th><th class="r">金额</th><th class="r">已付</th><th>状态</th></tr></thead><tbody>${os.map(o=>`<tr onclick="purDetail(${o.id})"><td class="mono">${o.order_no}</td><td>${o.supplier_name||'-'}</td><td>${o.order_date?.slice(0,10)}</td><td class="r b">${Y(o.total_amount)}</td><td class="r b">${Y(o.paid_amount)}</td><td><span class="badge ${o.status==='draft'?'bg-dr':'bg-ok'}">${S[o.status]}</span></td></tr>`).join('')||`<tr><td colspan="6"><div class="empty"><div class="em">📦</div><p>暂无采购单</p></div></td></tr>`}</tbody></table></div>`;
  },

  inventory:async()=>{
    const d=await api('/inventory');const inv=Array.isArray(d)?d:[];
    document.getElementById('mainContent').innerHTML=`
      <div class="phead"><h2>库存管理</h2><div class="pactions"><button class="btn btn-p" onclick="prodForm()">+ 商品</button></div></div>
      <div class="tbl"><table><thead><tr><th>商品</th><th>规格</th><th>品牌/分类</th><th class="r">进价</th><th class="r">售价</th><th class="r">库存</th></tr></thead><tbody>${inv.map(v=>`<tr style="${v.quantity<=v.safety_stock&&v.safety_stock>0?'background:var(--r50)':''}"><td><strong>${v.name}</strong>${v.quantity<=v.safety_stock&&v.safety_stock>0?' <span class="badge bg-err">低库存</span>':''}</td><td>${v.spec||'-'} / ${v.unit}</td><td>${v.brand||'-'} · ${v.category||'-'}</td><td class="r b">${Y(v.purchase_price)}</td><td class="r b">${Y(v.sale_price)}</td><td class="r b" style="color:${v.quantity<=v.safety_stock?'var(--r500)':'inherit'}">${v.quantity}</td></tr>`).join('')||`<tr><td colspan="6"><div class="empty"><div class="em">🏪</div><p>请先添加商品</p></div></td></tr>`}</tbody></table></div>`;
  },

  contacts:async()=>{
    const d=await api('/contacts');const cs=Array.isArray(d)?d:[];
    document.getElementById('mainContent').innerHTML=`
      <div class="phead"><h2>客户供应商</h2><div class="pactions"><button class="btn btn-p" onclick="contactForm()">+ 新增</button></div></div>

function addRow(id){const r=document.querySelector('#'+id+' .item-row');const c=r.cloneNode(true);c.querySelectorAll('input').forEach(i=>i.value=i.type==='number'?'1':'');c.querySelector('button').textContent='-';c.querySelector('button').onclick=function(){this.parentElement.remove()};document.getElementById(id).appendChild(c)}
async function subSale(){
  const cid=parseInt(document.getElementById('fCust').value);const items=[];
  document.querySelectorAll('#saleItems .item-row').forEach(r=>{const pid=parseInt(r.querySelector('.ip')?.value),qty=parseInt(r.querySelector('.iq')?.value)||0,price=parseFloat(r.querySelector('.ipr')?.value)||0;if(pid&&qty>0&&price>0)items.push({product_id:pid,quantity:qty,unit_price:price})});
  if(!cid||!items.length)return toast('请完善信息','er');
  const r=await api('/sale-orders',{method:'POST',body:{customer_id:cid,items,discount:parseFloat(document.getElementById('fDisc')?.value)||0,note:document.getElementById('fNote')?.value}});
  r?.success?(navigate('sale'),toast('创建成功','ok')):toast(r?.detail||'失败','er')
}
async function saleDetail(id){
  const d=await api('/sale-orders/'+id);if(!d?.order)return;const o=d.order,is=d.items||[];
  let ac=o.status==='draft'?`<button class="btn btn-p" onclick="delSO(${o.id})">确认出库</button>`:o.status==='delivered'?`<button class="btn btn-p" onclick="sigSO(${o.id})">确认签收</button> <button class="btn" onclick="pm('ar','sale',${o.id},${o.customer_id},${o.total_amount-o.received_amount})">收款</button>`:o.status==='signed'?`<button class="btn" onclick="pm('ar','sale',${o.id},${o.customer_id},${o.total_amount-o.received_amount})">收款</button>`:'';
  document.getElementById('mainContent').innerHTML=`<button class="btn btn-g" onclick="navigate('sale')" style="margin-bottom:10px">← 返回列表</button><div class="detail"><div class="dh"><span class="dht">${o.order_no}</span><span class="badge ${o.status==='draft'?'bg-dr':o.status==='delivered'?'bg-act':'bg-ok'}">${S[o.status]}</span></div><div class="db"><div class="dm"><div class="mi"><div class="ml">客户</div><div class="mv">${o.customer_name}</div></div><div class="mi"><div class="ml">日期</div><div class="mv">${o.order_date?.slice(0,10)}</div></div><div class="mi"><div class="ml">金额</div><div class="mv">${Y(o.total_amount)}</div></div><div class="mi"><div class="ml">已收</div><div class="mv">${Y(o.received_amount)}</div></div></div><table><tr><th>商品</th><th class="r">数量</th><th class="r">单价</th><th class="r">金额</th></tr>${is.map(i=>`<tr><td>${i.product_name} ${i.spec||''}</td><td class="r">${i.quantity}${i.unit||''}</td><td class="r">${Y(i.unit_price)}</td><td class="r"><strong>${Y(i.amount)}</strong></td></tr>`).join('')}</table><div class="fa">${ac}</div></div></div>`;
}

async function subUser(){

function pm(type,refType,refId,cid,max){
  api('/contacts/'+cid).then(c=>{const a=prompt(`${type==='ar'?'收款':'付款'} - ${c?.name||''}\n最大 ${Y(max)}`,max?.toFixed(2));if(!a)return;
  api('/payments',{method:'POST',body:{contact_id:cid,amount:parseFloat(a),pay_type:type,ref_type:refType,ref_id:refId}}).then(r=>{if(r?.success){navigate(tab);toast('操作成功','ok')}else toast(r?.detail,'er')})});
}
