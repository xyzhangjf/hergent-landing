# v299（2026-09-27）：让后端能读到 Hermes 网关的定时任务数据。
#
# 症状：/api/cron/jobs 返回 HTTP **200**，但正文是一段 Python traceback
#       （`FileNotFoundError: /root/.hermes/cron` → `OSError: [Errno 30] Read-only file system: '/root/.hermes'`）。
#       前端 `jobs = r.jobs || []` ⇒ **页面显示"没有定时任务"**，而真实有 1 条
#       （`853f2e208ae2 每日经营要务预生成`）⇒ **静默失效、零报错**。
#       ⚠️ 判据：「接口 200」只等于「闸门放行」，不等于「数据正常」。
#
# 根因：`10-sandbox.conf` 的 `ProtectHome=true` 会把 `/home`、`/root`、`/run/user`
#       挂成 **mode 700 的空 tmpfs**（连 root 自己都进不去 /root）。
#       systemd 的挂载命名空间是**进程级继承**的 —— `sudo` / `exec` 都**不会**重置它，
#       所以 `cron_tasks.py::_bridge()` 里的 `sudo -u root`（HOME=/root ⇒ `~/.hermes` = `/root/.hermes`）
#       一样穿不过去。gateway 的 `HERMES_HOME=/root/.hermes` 与后端读的**同一份**数据，
#       只有后端被沙箱挡住。
#       ⚠️ 已实测证否的错解：`BindPaths=/root/.hermes` —— 想到达它必须先穿过 mode-700 的 `/root`，
#          探针实测仍 `Permission denied`（父目录不可 traverse 时子挂载点无用）。
#
# 修法：`ProtectHome=read-only` —— 保留**真实**的 /root（连同它原本的 `drwx-----x`，other 只有 x），
#       再用 `ReadWritePaths=/root/.hermes` 把 cron 子树单独放成可写
#       （list 只读，但 create/pause/resume/remove 都要写 `jobs.json` 与 `.jobs.lock`）。
#
# 🔒 暴露面评估（探针实测，非推测）：
#   · `/root` 真实权限是 `drwx-----x` ⇒ hergent **本来就不能枚举 /root**（`ls /root` 仍 Permission denied）。
#   · `/root/.ssh` 是 `drwx------ root root`、私钥 600 ⇒ hergent **仍读不到**（实测 Permission denied）。
#   · 新增可见的仅「世界可读」的文件（如 `/root/.hermes/config.yaml.bak-*` 这类 root:root 644 的历史备份）。
#   · 与 v258 加沙箱**之前**对比：那时 hergent 就是直连 `/root/.hermes`（`hermes-gateway.service`
#     至今如此，WorkingDirectory 与 HERMES_HOME 都指向它）。本次只是把该既有事实**恢复**给后端进程，
#     并未放宽到 /root 的其它内容，也未放宽 /home。
#   · `ProtectSystem=full`、`PrivateTmp=true` 保持不变；`NoNewPrivileges` 仍由 `20-l1-umask.conf` 覆盖为 false。
#
# 回滚：删除本文件 ⇒ `systemctl daemon-reload` ⇒ `systemctl restart hergent-erp`
#       （立即回到 `ProtectHome=true`；代价仅是「定时任务」页再次变空，不影响其它功能）。
[Service]
ProtectHome=read-only
ReadWritePaths=/root/.hermes
