<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>商品档案管理 · 低温奶预报单系统 Web 端</title>
<style>
:root{
  --brand:#06b6d4;--brand-dark:#0891b2;--brand-light:rgba(6,182,212,.08);--brand-bg:rgba(6,182,212,.05);
  --bg:#f6f7f9;--card:#fff;--line:#e8eaee;
  --t1:#171717;--t2:#4d4d4d;--t3:#8a8f98;
  --green:#16a34a;--green-bg:#eefbf1;--red:#dc2626;--red-bg:#fef2f2;--amber:#d97706;--amber-bg:#fff7e8;
  --radius:12px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  background:var(--bg);color:var(--t1);font-size:14px;
}
/* ===== 布局 ===== */
.layout{display:flex;min-height:100vh;}
.sidebar{
  width:230px;background:#fff;border-right:1px solid var(--line);flex:0 0 230px;
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
}
.main{flex:1;min-width:0;padding:24px 28px;}
/* ===== 侧边栏 ===== */
.logo{display:flex;align-items:center;gap:10px;padding:18px 18px 14px;border-bottom:1px solid var(--line);}
.logo .ic{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#0e7490,var(--brand));color:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;flex:0 0 auto;}
.logo .tx b{font-size:14px;display:block;}
.logo .tx span{font-size:11px;color:var(--t3);}
.tenant-box{margin:12px 14px;background:var(--brand-bg);border:1px solid rgba(6,182,212,.15);border-radius:10px;padding:10px 12px;}
.tenant-box .tn{font-size:12.5px;font-weight:600;color:var(--brand-dark);}
.tenant-box .ts{font-size:11px;color:var(--t3);margin-top:3px;}
.nav-group{padding:8px 10px;}
.nav-group .gh{font-size:11px;color:var(--t3);padding:10px 10px 6px;}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;cursor:pointer;
  font-size:13.5px;color:var(--t2);margin-bottom:2px;position:relative;
}
.nav-item:hover{background:#f3f4f6;}
.nav-item.active{background:var(--brand-light);color:var(--brand-dark);font-weight:600;}
.nav-item .nbadge{
  margin-left:auto;background:var(--red);color:#fff;font-size:10.5px;min-width:17px;height:17px;
  border-radius:99px;display:flex;align-items:center;justify-content:center;padding:0 5px;
}
.side-foot{margin-top:auto;padding:14px;border-top:1px solid var(--line);font-size:11px;color:var(--t3);}
/* ===== 页头 ===== */
.page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:12px;flex-wrap:wrap;}
.page-head h1{font-size:20px;font-weight:700;}
.page-head .desc{font-size:12.5px;color:var(--t3);margin-top:3px;}
.page-head .acts{display:flex;gap:8px;flex-wrap:wrap;}
/* ===== 按钮 ===== */
.btn{border:none;border-radius:9px;padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
.btn-primary{background:var(--brand);color:#fff;}
.btn-primary:hover{background:var(--brand-dark);}
.btn-dark{background:var(--t1);color:#fff;}
.btn-dark:hover{background:#333;}
.btn-outline{background:#fff;border:1px solid var(--line);color:var(--t2);}
.btn-outline:hover{border-color:var(--brand);color:var(--brand-dark);}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:7px;}
.btn-link{background:none;border:none;color:var(--brand-dark);font-size:12.5px;cursor:pointer;padding:4px 6px;}
.btn-link:hover{text-decoration:underline;}
.btn-link.danger{color:var(--red);}
/* ===== 统计卡 ===== */
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px;}
.stat{background:#fff;border-radius:var(--radius);padding:14px 18px;border:1px solid var(--line);}
.stat .v{font-size:22px;font-weight:800;color:var(--brand-dark);font-variant-numeric:tabular-nums;}
.stat .k{font-size:12px;color:var(--t3);margin-top:2px;}
/* ===== 工具条 ===== */
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap;}
.toolbar input[type=text]{
  flex:1;min-width:200px;padding:9px 14px;border:1px solid var(--line);border-radius:99px;font-size:13px;outline:none;background:#fff;
}
.toolbar input[type=text]:focus{border-color:var(--brand);}
.toolbar select{padding:9px 12px;border:1px solid var(--line);border-radius:9px;font-size:13px;background:#fff;color:var(--t1);outline:none;}
/* ===== 表格 ===== */
.table-card{background:#fff;border-radius:var(--radius);border:1px solid var(--line);overflow:hidden;}
table{width:100%;border-collapse:collapse;}
th{
  text-align:left;font-size:12px;color:var(--t3);font-weight:600;padding:10px 14px;
  background:#fafbfc;border-bottom:1px solid var(--line);white-space:nowrap;
}
td{padding:11px 14px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:#fafbfc;}
.pname{font-weight:600;}
.pname .alias{display:inline-block;font-size:11px;color:var(--brand-dark);background:var(--brand-light);border-radius:4px;padding:1px 7px;margin-left:6px;}
.pspec{font-size:11.5px;color:var(--t3);margin-top:2px;}
.price{font-variant-numeric:tabular-nums;white-space:nowrap;}
.price small{color:var(--t3);}
.chip{display:inline-block;font-size:11px;padding:2px 9px;border-radius:99px;font-weight:600;}
.chip.on{background:var(--green-bg);color:var(--green);}
.chip.off{background:#f3f4f6;color:var(--t3);}
.chip.warn{background:var(--amber-bg);color:var(--amber);}
.chip.new{background:var(--brand-light);color:var(--brand-dark);}
.empty-row td{text-align:center;padding:44px 0;color:var(--t3);font-size:13px;}
.bulk-bar{
  display:none;align-items:center;gap:12px;background:var(--brand-bg);border:1px solid rgba(6,182,212,.2);
  border-radius:10px;padding:9px 14px;margin-bottom:12px;font-size:13px;
}
.bulk-bar.show{display:flex;}
/* ===== 弹窗 ===== */
.mask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:50;display:none;align-items:flex-start;justify-content:center;padding:6vh 20px;overflow-y:auto;}
.mask.show{display:flex;}
.modal{background:#fff;border-radius:16px;width:100%;max-width:560px;animation:pop .2s ease;margin-bottom:6vh;}
.modal.wide{max-width:760px;}
@keyframes pop{from{transform:scale(.96);opacity:0;}to{transform:scale(1);opacity:1;}}
.modal .mh{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line);}
.modal .mh h3{font-size:16px;}
.modal .mh .x{border:none;background:none;font-size:18px;color:var(--t3);cursor:pointer;padding:4px;}
.modal .mb{padding:20px 22px;}
.modal .mf{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;}
.f-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.f-grid .full{grid-column:1/-1;}
.field label{display:block;font-size:12px;color:var(--t3);margin-bottom:5px;}
.field label b{color:var(--red);}
.field input,.field select{
  width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:9px;font-size:13.5px;outline:none;background:#fafbfc;
}
.field input:focus,.field select:focus{border-color:var(--brand);background:#fff;}
.unit-price-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.up-box{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fafbfc;}
.up-box .ut{font-size:12px;font-weight:600;margin-bottom:6px;color:var(--t2);}
.up-box input{width:100%;padding:6px 9px;border:1px solid var(--line);border-radius:7px;font-size:13px;outline:none;}
.up-box input:focus{border-color:var(--brand);}
.hint{font-size:11.5px;color:var(--t3);margin-top:8px;line-height:1.6;}
/* ===== 导入预览 ===== */
.imp-sum{display:flex;gap:10px;margin-bottom:14px;}
.imp-sum .it{flex:1;background:#fafbfc;border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center;}
.imp-sum .it b{font-size:20px;display:block;font-variant-numeric:tabular-nums;}
.imp-sum .it.ok b{color:var(--green);}
.imp-sum .it.dup b{color:var(--amber);}
.imp-sum .it.bad b{color:var(--red);}
.imp-sum .it span{font-size:11.5px;color:var(--t3);}
/* ===== 审核卡 ===== */
.req-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:12px;}
.req-card .rh{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.req-card .rh b{font-size:14.5px;}
.req-card .rmeta{font-size:12px;color:var(--t3);line-height:1.8;}
.req-card .rnote{background:#fafbfc;border-radius:8px;padding:9px 12px;font-size:12.5px;color:var(--t2);margin:10px 0;}
.req-card .racts{display:flex;gap:8px;margin-top:10px;}
.req-card.done{opacity:.65;}
/* ===== Toast ===== */
.toast{
  position:fixed;left:50%;bottom:36px;transform:translateX(-50%) translateY(8px);
  background:rgba(23,23,23,.92);color:#fff;font-size:13px;padding:10px 20px;border-radius:99px;
  opacity:0;pointer-events:none;transition:all .25s;z-index:99;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.log-item{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:13px;}
.log-item:last-child{border-bottom:none;}
.log-item .lt{color:var(--t3);font-size:12px;flex:0 0 auto;width:130px;}
</style>
</head>
<body>
<div class="layout">
  <!-- 侧边栏 -->
  <aside class="sidebar">
    <div class="logo">
      <div class="ic">🧊</div>
      <div class="tx"><b>低温奶预报单</b><span>Web 管理端</span></div>
    </div>
    <div class="tenant-box">
      <div class="tn">鑫源乳业（襄阳）</div>
      <div class="ts">标准版 · 3/15 预报人</div>
    </div>
    <div class="nav-group">
      <div class="gh">商品管理</div>
      <div class="nav-item active" data-nav="list">📦 商品档案</div>
      <div class="nav-item" data-nav="requests">📝 新增申请 <span class="nbadge" id="reqBadge">2</span></div>
      <div class="nav-item" data-nav="logs">🗂 导入记录</div>
    </div>
    <div class="nav-group">
      <div class="gh">其他（示意）</div>
      <div class="nav-item" style="opacity:.45;cursor:default;">📋 预报批次</div>
      <div class="nav-item" style="opacity:.45;cursor:default;">👥 成员管理</div>
      <div class="nav-item" style="opacity:.45;cursor:default;">⚙️ 设置</div>
    </div>
    <div class="side-foot">商品主数据唯一出口：Web 端维护<br>手机端只读 + 申请新增 · 原型演示</div>
  </aside>

  <!-- 主内容 -->
  <main class="main" id="main"></main>
</div>

<div class="mask" id="mask"></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* ================= 数据 ================= */
const CATEGORIES=['低温酸奶','鲜奶','乳酸菌','常温奶'];
function seedProducts(){
  return [
    {id:'p1',name:'蒙牛单果粒黄桃酸奶',alias:'单黄',spec:'250ml×12瓶/板',barcode:'6902088160011',cat:'低温酸奶',
      units:[{label:'瓶',price:3.2},{label:'提',price:36},{label:'板',price:70}],status:'on',src:'舟谱导入'},
    {id:'p2',name:'蒙牛单果粒草莓酸奶',alias:'单草',spec:'250ml×12瓶/板',barcode:'6902088160028',cat:'低温酸奶',
      units:[{label:'瓶',price:3.2},{label:'提',price:36},{label:'板',price:70}],status:'on',src:'舟谱导入'},
    {id:'p3',name:'蒙牛纯甄风味酸奶',alias:'纯甄',spec:'200g×12杯/板',barcode:'6902088160035',cat:'低温酸奶',
      units:[{label:'杯',price:3.5},{label:'提',price:40},{label:'板',price:78}],status:'on',src:'舟谱导入'},
    {id:'p4',name:'蒙牛优益C乳酸菌',alias:'优益',spec:'340ml×6瓶/箱',barcode:'6902088160042',cat:'乳酸菌',
      units:[{label:'瓶',price:5.5},{label:'箱',price:31},{label:'板',price:60}],status:'on',src:'舟谱导入'},
    {id:'p5',name:'蒙牛冠益乳风味发酵乳',alias:'冠润',spec:'100g×8杯/板',barcode:'6902088160059',cat:'低温酸奶',
      units:[{label:'杯',price:3.0},{label:'提',price:22.5},{label:'板',price:44}],status:'on',src:'舟谱导入'},
    {id:'p6',name:'蒙牛每日鲜语鲜牛奶',alias:'鲜语',spec:'250ml×16盒/箱',barcode:'6902088160066',cat:'鲜奶',
      units:[{label:'盒',price:2.8},{label:'箱',price:42},{label:'板',price:82}],status:'on',src:'舟谱导入'},
    {id:'p7',name:'蒙牛特仑苏纯牛奶',alias:'特仑苏',spec:'250ml×12盒/箱',barcode:'6902088160073',cat:'常温奶',
      units:[{label:'盒',price:5.2},{label:'箱',price:58}],status:'on',src:'手工新建'},
    {id:'p8',name:'蒙牛早餐奶核桃味',alias:'早餐奶',spec:'250ml×16盒/箱',barcode:'6902088160080',cat:'常温奶',
      units:[{label:'盒',price:3.1},{label:'箱',price:46}],status:'off',src:'手工新建'}
  ];
}
function seedRequests(){
  return [
    {id:'r1',name:'伊利畅轻希腊酸奶',from:'王芳（业务员）· 万华超市广场店',time:'今日 10:24',
      note:'门店要求上这个，大概 200g×8杯，零售价 4 块左右，麻烦加一下',status:'pending'},
    {id:'r2',name:'君乐宝悦鲜活鲜牛奶',from:'襄阳宏发商贸（分销商）',time:'今日 11:02',
      note:'下面终端最近都在问悦鲜活，950ml 瓶装，建议尽快加上',status:'pending'}
  ];
}
function seedLogs(){
  return [
    {time:'2026-08-08 16:40',text:'舟谱商品导出_0808.xlsx 导入：新增 371 个，重复跳过 0 个',by:'张俊峰'},
    {time:'2026-08-10 09:15',text:'手工新建：蒙牛特仑苏纯牛奶',by:'张俊峰'},
    {time:'2026-08-11 14:30',text:'批量调价：12 个商品上调 3%',by:'李婷'}
  ];
}
/* 模拟的舟谱导出文件解析结果 */
const IMPORT_PREVIEW=[
  {name:'蒙牛大果粒芦荟酸奶',alias:'大芦荟',spec:'260g×12杯/板',barcode:'6902088160097',cat:'低温酸奶',units:[{label:'杯',price:3.6},{label:'提',price:41},{label:'板',price:80}],verdict:'new'},
  {name:'蒙牛特仑苏有机纯牛奶',alias:'特仑苏有机',spec:'250ml×12盒/箱',barcode:'6902088160103',cat:'常温奶',units:[{label:'盒',price:6.5},{label:'箱',price:74}],verdict:'new'},
  {name:'蒙牛每日鲜语4.0鲜牛奶',alias:'鲜语4.0',spec:'720ml×6瓶/箱',barcode:'6902088160110',cat:'鲜奶',units:[{label:'瓶',price:16.9},{label:'箱',price:96}],verdict:'new'},
  {name:'蒙牛单果粒黄桃酸奶',alias:'单黄',spec:'250ml×12瓶/板',barcode:'6902088160011',cat:'低温酸奶',units:[],verdict:'dup'},
  {name:'蒙牛纯甄风味酸奶',alias:'纯甄',spec:'200g×12杯/板',barcode:'6902088160035',cat:'低温酸奶',units:[],verdict:'dup'}
];

/* ================= 状态 ================= */
const LS='hergent-web-product-admin-v1';
const $=s=>document.querySelector(s);
const fmt=n=>'¥'+Number(n).toLocaleString('zh-CN',{minimumFractionDigits:Number(n)%1?2:0,maximumFractionDigits:2});
let db,nav='list';
function load(){
  try{const raw=localStorage.getItem(LS);
    if(raw){db=JSON.parse(raw);}else{db={products:seedProducts(),requests:seedRequests(),logs:seedLogs(),kw:'',cat:'',sel:[]};}
  }catch(e){db={products:seedProducts(),requests:seedRequests(),logs:seedLogs(),kw:'',cat:'',sel:[]};}
}
function save(){try{localStorage.setItem(LS,JSON.stringify(db));}catch(e){}}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._tm);t._tm=setTimeout(()=>t.classList.remove('show'),2200);}
function showModal(html){$('#mask').innerHTML=`<div class="modal">${html}</div>`;$('#mask').classList.add('show');}
function showModalWide(html){$('#mask').innerHTML=`<div class="modal wide">${html}</div>`;$('#mask').classList.add('show');}
function hideModal(){$('#mask').classList.remove('show');$('#mask').innerHTML='';}
const productOf=id=>db.products.find(p=>p.id===id);

/* ================= 视图：商品列表 ================= */
function filteredProducts(){
  const kw=db.kw.trim().toLowerCase();
  return db.products.filter(p=>{
    if(db.cat&&p.cat!==db.cat)return false;
    if(!kw)return true;
    return p.name.toLowerCase().includes(kw)||p.alias.toLowerCase().includes(kw)||(p.barcode||'').includes(kw);
  });
}
function renderList(){
  const list=filteredProducts();
  const selCount=db.sel.length;
  return `
  <div class="page-head">
    <div>
      <h1>商品档案</h1>
      <div class="desc">商品主数据在 Web 端统一维护，手机端填报时只读引用 · 共 ${db.products.length} 个 SKU</div>
    </div>
    <div class="acts">
      <button class="btn btn-outline" data-act="open-import">📥 Excel 批量导入</button>
      <button class="btn btn-dark" data-act="new-product" data-primary-action>＋ 新建商品</button>
    </div>
  </div>
  <div class="stat-row">
    <div class="stat"><div class="v">${db.products.length}</div><div class="k">SKU 总数</div></div>
    <div class="stat"><div class="v">${db.products.filter(p=>p.status==='on').length}</div><div class="k">在售</div></div>
    <div class="stat"><div class="v">${db.products.filter(p=>p.src==='舟谱导入').length}</div><div class="k">舟谱导入</div></div>
    <div class="stat"><div class="v">${db.requests.filter(r=>r.status==='pending').length}</div><div class="k">待审申请</div></div>
  </div>
  <div class="toolbar">
    <input type="text" id="kw" placeholder="搜索名称 / 简称 / 条码，如：单黄" value="${db.kw}">
    <select id="catSel">
      <option value="">全部分类</option>
      ${CATEGORIES.map(c=>`<option ${db.cat===c?'selected':''}>${c}</option>`).join('')}
    </select>
  </div>
  <div class="bulk-bar ${selCount?'show':''}">
    已选 <b>${selCount}</b> 个商品
    <button class="btn btn-sm btn-outline" data-act="open-reprice">💰 批量调价</button>
    <button class="btn-link" data-act="clear-sel">取消选择</button>
  </div>
  <div class="table-card">
    <table>
      <thead><tr>
        <th style="width:34px;"><input type="checkbox" id="ckAll" ${selCount&&selCount===list.length?'checked':''}></th>
        <th>商品</th><th>条码</th><th>分类</th>
        <th>小单位价</th><th>中单位价</th><th>大单位价</th>
        <th>状态</th><th>来源</th><th style="width:110px;">操作</th>
      </tr></thead>
      <tbody>
        ${list.length?list.map(p=>`<tr>
          <td><input type="checkbox" class="ck" data-id="${p.id}" ${db.sel.includes(p.id)?'checked':''}></td>
          <td><div class="pname">${p.name}<span class="alias">${p.alias}</span></div><div class="pspec">${p.spec}</div></td>
          <td style="color:var(--t3);font-size:12px;">${p.barcode||'—'}</td>
          <td>${p.cat}</td>
          ${[0,1,2].map(i=>{const u=p.units[i];return `<td class="price">${u?fmt(u.price)+'<small>/'+u.label+'</small>':'—'}</td>`;}).join('')}
          <td><span class="chip ${p.status==='on'?'on':'off'}">${p.status==='on'?'在售':'停用'}</span></td>
          <td style="font-size:12px;color:var(--t3);">${p.src}</td>
          <td>
            <button class="btn-link" data-act="edit" data-id="${p.id}">编辑</button>
            <button class="btn-link ${p.status==='on'?'danger':''}" data-act="toggle-status" data-id="${p.id}">${p.status==='on'?'停用':'启用'}</button>
          </td>
        </tr>`).join(''):`<tr class="empty-row"><td colspan="10">没有匹配「${db.kw}」的商品，试试搜"单黄""纯甄"</td></tr>`}
      </tbody>
    </table>
  </div>`;
}

/* ================= 视图：新增申请 ================= */
function renderRequests(){
  const reqs=db.requests;
  return `
  <div class="page-head">
    <div>
      <h1>新增商品申请</h1>
      <div class="desc">一线人员在手机端填报时搜不到的商品，会提交到这里由管理员补全信息后上架</div>
    </div>
  </div>
  ${reqs.length?reqs.map(r=>`
    <div class="req-card ${r.status!=='pending'?'done':''}">
      <div class="rh">
        <b>${r.name}</b>
        ${r.status==='pending'?'<span class="chip warn">待审核</span>':r.status==='approved'?'<span class="chip on">已通过</span>':'<span class="chip off">已驳回</span>'}
      </div>
      <div class="rmeta">申请人：${r.from}<br>提交时间：${r.time}</div>
      <div class="rnote">💬 ${r.note}</div>
      ${r.status==='pending'?`
      <div class="racts">
        <button class="btn btn-primary btn-sm" data-act="approve-req" data-id="${r.id}" data-primary-action>✓ 补全信息并通过</button>
        <button class="btn btn-outline btn-sm" data-act="reject-req" data-id="${r.id}">驳回</button>
      </div>`:''}
    </div>`).join(''):`<div class="req-card" style="text-align:center;color:var(--t3);padding:40px;">暂无申请</div>`}`;
}

/* ================= 视图：导入记录 ================= */
function renderLogs(){
  return `
  <div class="page-head">
    <div><h1>导入记录</h1><div class="desc">舟谱 Excel 批量导入与调价的操作日志</div></div>
    <div class="acts"><button class="btn btn-outline" data-act="open-import">📥 Excel 批量导入</button></div>
  </div>
  <div class="table-card" style="padding:6px 18px;">
    ${db.logs.map(l=>`<div class="log-item"><span class="lt">${l.time}</span><span style="flex:1;">${l.text}</span><span style="color:var(--t3);font-size:12px;">${l.by}</span></div>`).join('')}
  </div>`;
}

/* ================= 渲染调度 ================= */
function render(){
  const m=$('#main');
  if(nav==='list')m.innerHTML=renderList();
  else if(nav==='requests')m.innerHTML=renderRequests();
  else m.innerHTML=renderLogs();
  // 角标
  const n=db.requests.filter(r=>r.status==='pending').length;
  const badge=$('#reqBadge');
  badge.style.display=n?'flex':'none';badge.textContent=n;
  // 事件绑定
  const kw=$('#kw');
  if(kw)kw.addEventListener('input',e=>{db.kw=e.target.value;save();render();
    const el=$('#kw');el.focus();el.setSelectionRange(el.value.length,el.value.length);});
  const cat=$('#catSel');
  if(cat)cat.addEventListener('change',e=>{db.cat=e.target.value;save();render();});
  const ckAll=$('#ckAll');
  if(ckAll)ckAll.addEventListener('change',e=>{
    db.sel=e.target.checked?filteredProducts().map(p=>p.id):[];save();render();});
  document.querySelectorAll('.ck').forEach(c=>c.addEventListener('change',e=>{
    const id=e.target.dataset.id;
    if(e.target.checked){if(!db.sel.includes(id))db.sel.push(id);}
    else db.sel=db.sel.filter(x=>x!==id);
    save();render();
  }));
}

/* ================= 弹窗：新建/编辑 ================= */
function openProductModal(pid){
  const p=pid?productOf(pid):null;
  showModal(`
    <div class="mh"><h3>${p?'编辑商品':'新建商品'}</h3><button class="x" data-act="close-modal">✕</button></div>
    <div class="mb">
      <div class="f-grid">
        <div class="field full"><label>商品名称 <b>*</b></label><input id="fName" value="${p?p.name:''}" placeholder="如：蒙牛单果粒黄桃酸奶"></div>
        <div class="field"><label>简称（手机端搜索用）<b>*</b></label><input id="fAlias" value="${p?p.alias:''}" placeholder="如：单黄"></div>
        <div class="field"><label>规格</label><input id="fSpec" value="${p?p.spec:''}" placeholder="如：250ml×12瓶/板"></div>
        <div class="field"><label>条码</label><input id="fBarcode" value="${p?p.barcode||'':''}" placeholder="13 位条码"></div>
        <div class="field"><label>分类</label>
          <select id="fCat">${CATEGORIES.map(c=>`<option ${p&&p.cat===c?'selected':''}>${c}</option>`).join('')}</select>
        </div>
        <div class="field full">
          <label>多单位价格（小 / 中 / 大）</label>
          <div class="unit-price-grid">
            ${[0,1,2].map(i=>{const u=p&&p.units[i];return `
              <div class="up-box">
                <div class="ut">单位${i+1}${i===0?'（必填）':''}</div>
                <input id="fUnit${i}" value="${u?u.label:''}" placeholder="单位名" style="margin-bottom:6px;">
                <input id="fPrice${i}" value="${u?u.price:''}" placeholder="单价 ¥" inputmode="decimal">
              </div>`;}).join('')}
          </div>
          <div class="hint">手机端填报按"小/中/大"单位选规格。大单位通常是板/箱，价格应低于小单位累加（批发折让）。</div>
        </div>
      </div>
    </div>
    <div class="mf">
      <button class="btn btn-outline" data-act="close-modal">取消</button>
      <button class="btn btn-primary" data-act="save-product" data-pid="${pid||''}" data-primary-action>保存</button>
    </div>`);
}
function saveProduct(pid){
  const name=$('#fName').value.trim(),alias=$('#fAlias').value.trim();
  if(!name){toast('请填写商品名称');return;}
  if(!alias){toast('请填写简称（手机端搜索需要）');return;}
  const units=[];
  for(let i=0;i<3;i++){
    const ul=$('#fUnit'+i).value.trim(),up=$('#fPrice'+i).value.trim();
    if(ul||up){
      const price=parseFloat(up);
      if(isNaN(price)||price<=0){toast(`单位${i+1} 价格无效`);return;}
      units.push({label:ul||('单位'+(i+1)),price});
    }
  }
  if(!units.length){toast('请至少填写一档单位价格');return;}
  const data={name,alias,spec:$('#fSpec').value.trim(),barcode:$('#fBarcode').value.trim(),cat:$('#fCat').value,units};
  if(pid){Object.assign(productOf(pid),data);toast('商品已更新');}
  else{
    db.products.unshift({id:'p'+Date.now(),status:'on',src:'手工新建',...data});
    db.logs.unshift({time:nowStr(),text:'手工新建：'+name,by:'张俊峰'});
    toast('商品已创建');
  }
  save();hideModal();render();
}
function nowStr(){const d=new Date();const p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;}

/* ================= 弹窗：导入 ================= */
function openImport(){
  const news=IMPORT_PREVIEW.filter(x=>x.verdict==='new');
  const dups=IMPORT_PREVIEW.filter(x=>x.verdict==='dup');
  showModalWide(`
    <div class="mh"><h3>Excel 批量导入（舟谱商品导出）</h3><button class="x" data-act="close-modal">✕</button></div>
    <div class="mb">
      <div style="border:1.5px dashed var(--line);border-radius:12px;padding:20px;text-align:center;margin-bottom:16px;background:#fafbfc;">
        <div style="font-size:26px;">📄</div>
        <div style="font-size:13.5px;font-weight:600;margin:6px 0 4px;">舟谱商品导出_0812.xlsx</div>
        <div style="font-size:12px;color:var(--t3);">演示模式：已模拟解析完成 · 真实版从舟谱导出 Excel 后上传</div>
      </div>
      <div class="imp-sum">
        <div class="it ok"><b>${news.length}</b><span>新增入库</span></div>
        <div class="it dup"><b>${dups.length}</b><span>条码重复 · 自动跳过</span></div>
        <div class="it bad"><b>0</b><span>格式异常</span></div>
      </div>
      <div class="table-card">
        <table>
          <thead><tr><th>商品</th><th>条码</th><th>单位价格</th><th>结果</th></tr></thead>
          <tbody>
            ${IMPORT_PREVIEW.map(x=>`<tr>
              <td><div class="pname">${x.name}<span class="alias">${x.alias}</span></div><div class="pspec">${x.spec}</div></td>
              <td style="color:var(--t3);font-size:12px;">${x.barcode}</td>
              <td class="price" style="font-size:12px;">${x.units.length?x.units.map(u=>fmt(u.price)+'/'+u.label).join(' · '):'—'}</td>
              <td>${x.verdict==='new'?'<span class="chip new">新增</span>':'<span class="chip warn">重复跳过</span>'}</td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>
    <div class="mf">
      <button class="btn btn-outline" data-act="close-modal">取消</button>
      <button class="btn btn-primary" data-act="confirm-import" data-primary-action>确认导入 ${news.length} 个新商品</button>
    </div>`);
}
function confirmImport(){
  const news=IMPORT_PREVIEW.filter(x=>x.verdict==='new');
  let added=0;
  news.forEach(x=>{
    if(db.products.find(p=>p.barcode===x.barcode))return;
    db.products.push({id:'p'+Date.now()+added,name:x.name,alias:x.alias,spec:x.spec,barcode:x.barcode,
      cat:x.cat,units:x.units,status:'on',src:'舟谱导入'});
    added++;
  });
  db.logs.unshift({time:nowStr(),text:`舟谱商品导出_0812.xlsx 导入：新增 ${added} 个，重复跳过 ${IMPORT_PREVIEW.length-added} 个`,by:'张俊峰'});
  save();hideModal();render();toast(`导入完成：新增 ${added} 个商品`);
}

/* ================= 弹窗：批量调价 ================= */
function openReprice(){
  const sel=db.sel.map(id=>productOf(id)).filter(Boolean);
  if(!sel.length){toast('请先勾选商品');return;}
  showModal(`
    <div class="mh"><h3>批量调价</h3><button class="x" data-act="close-modal">✕</button></div>
    <div class="mb">
      <div class="hint" style="margin:0 0 12px;">已选 ${sel.length} 个商品，调价将作用于每个商品的全部单位价格。</div>
      <div class="f-grid">
        <div class="field"><label>调价方式</label>
          <select id="rpMode">
            <option value="up">涨价（%）</option>
            <option value="down">降价（%）</option>
          </select>
        </div>
        <div class="field"><label>幅度（%）</label><input id="rpVal" value="5" inputmode="decimal"></div>
      </div>
      <div style="font-size:12.5px;font-weight:600;margin:14px 0 6px;">调价预览</div>
      <div class="table-card" id="rpPreview"></div>
    </div>
    <div class="mf">
      <button class="btn btn-outline" data-act="close-modal">取消</button>
      <button class="btn btn-primary" data-act="confirm-reprice" data-primary-action>确认调价</button>
    </div>`);
  renderRepricePreview();
  $('#rpMode').addEventListener('change',renderRepricePreview);
  $('#rpVal').addEventListener('input',renderRepricePreview);
}
function rpCalc(){
  const mode=$('#rpMode').value,val=parseFloat($('#rpVal').value)||0;
  const factor=mode==='up'?1+val/100:Math.max(0,1-val/100);
  return factor;
}
function renderRepricePreview(){
  const sel=db.sel.map(id=>productOf(id)).filter(Boolean);
  const f=rpCalc();
  $('#rpPreview').innerHTML=`<table><thead><tr><th>商品</th><th>单位</th><th>现价</th><th>新价</th></tr></thead><tbody>
    ${sel.map(p=>p.units.map(u=>`<tr>
      <td>${p.alias}</td><td>${u.label}</td><td class="price">${fmt(u.price)}</td>
      <td class="price" style="color:var(--brand-dark);font-weight:700;">${fmt(Math.round(u.price*f*10)/10)}</td>
    </tr>`).join('')).join('')}
  </tbody></table>`;
}
function confirmReprice(){
  const f=rpCalc();
  const sel=db.sel.map(id=>productOf(id)).filter(Boolean);
  sel.forEach(p=>{p.units.forEach(u=>{u.price=Math.round(u.price*f*10)/10;});});
  const mode=$('#rpMode').value,val=$('#rpVal').value;
  db.logs.unshift({time:nowStr(),text:`批量调价：${sel.length} 个商品${mode==='up'?'上调':'下调'} ${val}%`,by:'张俊峰'});
  db.sel=[];save();hideModal();render();toast('调价已生效');
}

/* ================= 弹窗：审核通过（补全信息） ================= */
function openApprove(rid){
  const r=db.requests.find(x=>x.id===rid);
  showModal(`
    <div class="mh"><h3>通过申请 · 补全商品信息</h3><button class="x" data-act="close-modal">✕</button></div>
    <div class="mb">
      <div class="hint" style="margin:0 0 14px;">申请来源：${r.from}。申请人只填了名称，请补全简称、规格与价格后上架。</div>
      <div class="f-grid">
        <div class="field full"><label>商品名称</label><input id="apName" value="${r.name}"></div>
        <div class="field"><label>简称 <b>*</b></label><input id="apAlias" placeholder="如：畅轻"></div>
        <div class="field"><label>规格</label><input id="apSpec" placeholder="如：200g×8杯/板"></div>
        <div class="field full">
          <label>单位价格（至少一档）</label>
          <div class="unit-price-grid">
            ${[0,1,2].map(i=>`<div class="up-box"><div class="ut">单位${i+1}</div>
              <input id="apUnit${i}" placeholder="单位名" style="margin-bottom:6px;"><input id="apPrice${i}" placeholder="单价 ¥" inputmode="decimal"></div>`).join('')}
          </div>
        </div>
      </div>
    </div>
    <div class="mf">
      <button class="btn btn-outline" data-act="close-modal">取消</button>
      <button class="btn btn-primary" data-act="do-approve" data-id="${rid}" data-primary-action>通过并上架</button>
    </div>`);
}
function doApprove(rid){
  const r=db.requests.find(x=>x.id===rid);
  const alias=$('#apAlias').value.trim();
  if(!alias){toast('请补全简称');return;}
  const units=[];
  for(let i=0;i<3;i++){
    const ul=$('#apUnit'+i).value.trim(),up=$('#apPrice'+i).value.trim();
    if(ul||up){const price=parseFloat(up);
      if(isNaN(price)||price<=0){toast(`单位${i+1} 价格无效`);return;}
      units.push({label:ul||('单位'+(i+1)),price});}
  }
  if(!units.length){toast('请至少填写一档单位价格');return;}
  const name=$('#apName').value.trim();
  db.products.unshift({id:'p'+Date.now(),name,alias,spec:$('#apSpec').value.trim(),barcode:'',cat:'低温酸奶',units,status:'on',src:'申请通过'});
  r.status='approved';
  db.logs.unshift({time:nowStr(),text:`审核通过手机端申请：${name}（来自 ${r.from.split('（')[0]}）`,by:'张俊峰'});
  save();hideModal();render();toast(`「${name}」已上架，手机端可见`);
}

/* ================= 全局事件 ================= */
document.addEventListener('click',e=>{
  const nav_el=e.target.closest('[data-nav]');
  if(nav_el){nav=nav_el.dataset.nav;
    document.querySelectorAll('[data-nav]').forEach(x=>x.classList.toggle('active',x===nav_el));
    render();return;}
  const el=e.target.closest('[data-act]');if(!el)return;
  const act=el.dataset.act;
  if(act==='close-modal'){hideModal();return;}
  if(act==='new-product'){openProductModal(null);return;}
  if(act==='edit'){openProductModal(el.dataset.id);return;}
  if(act==='save-product'){saveProduct(el.dataset.pid||null);return;}
  if(act==='toggle-status'){const p=productOf(el.dataset.id);p.status=p.status==='on'?'off':'on';save();render();
    toast(p.status==='on'?'已启用':'已停用');return;}
  if(act==='open-import'){openImport();return;}
  if(act==='confirm-import'){confirmImport();return;}
  if(act==='open-reprice'){openReprice();return;}
  if(act==='confirm-reprice'){confirmReprice();return;}
  if(act==='clear-sel'){db.sel=[];save();render();return;}
  if(act==='approve-req'){openApprove(el.dataset.id);return;}
  if(act==='do-approve'){doApprove(el.dataset.id);return;}
  if(act==='reject-req'){const r=db.requests.find(x=>x.id===el.dataset.id);r.status='rejected';save();render();toast('已驳回');return;}
});

/* ================= 启动 ================= */
load();render();
</script>
</body>
</html>
