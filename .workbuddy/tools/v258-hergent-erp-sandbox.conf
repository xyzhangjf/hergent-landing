# v258 P0-1 A4：纵深防御沙箱（drop-in，删除本文件即完全回滚）
# 写路径依据：近 6 小时实测只写 /opt/hergent-erp（DB/日志/备份/chat_files）与 /opt/hermes-tenants（租户 home）
[Service]
# /home /root /run/user 只读且不可见（服务 home 是 /opt/hergent-erp，不受影响）
ProtectHome=true
# /usr /boot /etc /opt 等只读；下面用 ReadWritePaths 放开真正需要写的两处
ProtectSystem=full
ReadWritePaths=/opt/hergent-erp /opt/hermes-tenants
# 独立 /tmp，避免与其他服务/用户在共享 /tmp 上互相干扰
PrivateTmp=true
NoNewPrivileges=true
