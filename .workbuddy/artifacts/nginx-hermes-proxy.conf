# ============================================================
# Hermes 副驾代理配置片段（P1 修复：防「AI助手暂时离线」误报）
# 部署位置：生产 /etc/nginx/conf.d/ 下 Hermes server 段，或 hergent 站点
#           含 /hermes/ 的 location 块。以下为标准片段，按现网结构调整。
# 生效：nginx -t && systemctl reload nginx
# ============================================================

# 现有 /hermes/ 代理块补充以下指令（不要覆盖原有 proxy_pass / Authorization 注入）：
location /hermes/ {
    # 原有：proxy_pass http://127.0.0.1:18765/;
    # 原有：proxy_set_header Authorization "Bearer hergent-prod-gateway-key-2026";

    # —— P1 超时放大：覆盖最长 300s 长任务 + 余量，避免 nginx 提前掐断 SSE 流 ——
    proxy_read_timeout   320s;
    proxy_connect_timeout 10s;
    proxy_send_timeout   320s;

    # —— P1 结构化错误：上游 502/504 时返回 JSON detail 而非默认 HTML 错误页 ——
    # 前端 hermesChat 对 !res.ok 会 res.json()；HTML 错误页会解析失败落到"通信失败"。
    # 改为 JSON 后前端能精准显示「AI 服务暂时不可用」并触发退避重试。
    proxy_intercept_errors on;
    error_page 502 504 = @hermes_down;
}

# 上游不可达时的结构化响应（放在 server 块内、非 /hermes/  location 之外）
location @hermes_down {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 503 '{"detail":"AI 服务暂时不可用，请稍后再试"}';
}

# ============================================================
# 说明：
# 1. proxy_read_timeout 320s 针对分级超时上限（CHAT_TIMEOUT_LONG=300000）。
#    若未来长任务超过 300s，需同步放宽此处与前端 CHAT_TIMEOUT_LONG。
# 2. error_page 仅拦截 502/504（网关/上游断连）。401/403 由 Hermes 自身返回，
#    透传原 body 即可（前端已区分鉴权异常文案）。
# 3. 不要对 /hermes/ 设 proxy_buffering on 导致 SSE 缓冲——保持流式（off 或默认）。
# ============================================================
