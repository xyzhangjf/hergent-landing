<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>hergent.cn UI 改造蓝图 · 经营工作台 + 预报汇总表</title>
<style>
:root{
  --brand:#06b6d4;--brand-dark:#0891b2;--brand-deep:#0e7490;--brand-light:rgba(6,182,212,.08);--brand-bg:rgba(6,182,212,.05);
  --bg:#f6f8fa;--card:#fff;--line:#e9edf1;
  --t1:#17181c;--t2:#4b5563;--t3:#9aa3ae;
  --green:#16a34a;--green-bg:#ecfdf3;--red:#dc2626;--red-bg:#fef2f2;--amber:#d97706;--amber-bg:#fffbeb;
  --radius:14px;
  --shadow:0 1px 3px rgba(15,23,42,.05),0 0 0 1px rgba(15,23,42,.04);
  --shadow-md:0 8px 24px rgba(15,23,42,.08),0 0 0 1px rgba(15,23,42,.04);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--t1);font-size:14px;}
button{font-family:inherit;}
/* ===== 顶部标注条（蓝图说明） ===== */
.blueprint-bar{
  background:#0f172a;color:#fff;padding:9px 20px;font-size:12.5px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;
  position:sticky;top:0;z-index:300;
}
.blueprint-bar b{color:#67e8f9;}
.blueprint-bar .tag{background:rgba(103,232,249,.15);color:#67e8f9;padding:2px 9px;border-radius:99px;font-size:11px;}
/* ===== 整体布局 ===== */
.layout{display:flex;min-height:calc(100vh - 40px);}
/* ===== 左侧边栏 ===== */
.sidebar{
  width:248px;flex:0 0 248px;background:#fff;border-right:1px solid var(--line);
  display:flex;flex-direction:column;position:sticky;top:40px;height:calc(100vh - 40px);
}
.sb-head{padding:16px 16px 12px;display:flex;align-items:center;gap:10px;}
.sb-head .logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--brand-deep),var(--brand));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex:0 0 auto;}
.sb-head .tx b{font-size:15px;display:block;letter-spacing:-.3px;}
.sb-head .tx span{font-size:11px;color:var(--t3);}
.sb-search{margin:0 14px 8px;display:flex;align-items:center;gap:7px;background:#f3f5f7;border-radius:9px;padding:8px 11px;color:var(--t3);font-size:12.5px;}
.sb-scroll{flex:1;overflow-y:auto;padding:4px 10px 10px;}
.sb-group{margin-top:12px;}
.sb-group .gh{font-size:11px;color:var(--t3);font-weight:600;padding:0 8px 6px;letter-spacing:.5px;}
.sb-item{
  display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;cursor:pointer;
  font-size:13.5px;color:var(--t2);margin-bottom:2px;border:1px solid transparent;position:relative;
}
.sb-item svg{flex:0 0 auto;color:var(--t3);}
.sb-item:hover{background:#f3f5f7;}
.sb-item.active{background:var(--brand-light);color:var(--brand-deep);font-weight:600;border-color:rgba(6,182,212,.18);}
.sb-item.active svg{color:var(--brand-dark);}
.sb-item .nbadge{margin-left:auto;background:var(--red);color:#fff;font-size:10.5px;min-width:17px;height:17px;border-radius:99px;display:flex;align-items:center;justify-content:center;padding:0 5px;}
.sb-item .nbadge.cyan{background:var(--brand);;}
.sb-ai{
  margin:14px 4px 4px;border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer;background:linear-gradient(135deg,rgba(6,182,212,.04),rgba(139,92,246,.04));
}
.sb-ai:hover{border-color:rgba(6,182,212,.35);}
.sb-ai .t{font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:7px;}
.sb-ai .d{font-size:11px;color:var(--t3);margin-top:4px;line-height:1.6;}
.sb-foot{padding:10px 14px;border-top:1px solid var(--line);display:flex;align-items:center;gap:9px;}
.sb-foot .av{width:30px;height:30px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;}
.sb-foot .nm{flex:1;font-size:12.5px;line-height:1.3;}
.sb-foot .nm b{display:block;font-size:12.5px;}
.sb-foot .nm span{color:var(--t3);font-size:11px;}
/* ===== 主区 ===== */
.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.main-scroll{flex:1;overflow-y:auto;padding:22px 26px 30px;}
/* ===== 工作台 ===== */
.greet{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
.greet h1{font-size:21px;font-weight:700;letter-spacing:-.4px;}
.greet .sub{font-size:13px;color:var(--t2);margin-top:5px;}
.greet .sub b{color:var(--brand-dark);}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px;}
.kpi{background:#fff;border-radius:var(--radius);padding:16px 18px;border:1px solid var(--line);position:relative;overflow:hidden;}
.kpi::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--brand);border-radius:2px;}
.kpi.warn::before{background:var(--amber);}
.kpi.ok::before{background:var(--green);}
.kpi .k{font-size:12px;color:var(--t2);font-weight:600;display:flex;align-items:center;gap:6px;}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.5px;margin-top:7px;font-variant-numeric:tabular-nums;}
.kpi .v small{font-size:13px;color:var(--t3);font-weight:500;}
.kpi .d{font-size:11.5px;color:var(--t3);margin-top:4px;}
.kpi .d b{font-weight:700;}
.work-grid{display:grid;grid-template-columns:1.55fr 1fr;gap:14px;align-items:start;}
.wcard{background:#fff;border-radius:var(--radius);border:1px solid var(--line);overflow:hidden;}
.wcard .wh{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line);}
.wcard .wh h3{font-size:14.5px;font-weight:700;}
.wcard .wh .more{font-size:12px;color:var(--brand-dark);cursor:pointer;border:none;background:none;}
.wcard .wb{padding:8px 18px 14px;}
/* 批次进度 */
.batch-flow{display:flex;align-items:center;gap:0;margin:14px 0 6px;}
.bf-step{flex:1;text-align:center;position:relative;padding-top:20px;}
.bf-step::before{
  content:'';position:absolute;top:7px;left:calc(50% - 9px);width:18px;height:18px;border-radius:50%;
  background:#e5e9ee;border:3px solid #fff;box-shadow:0 0 0 1px var(--line);z-index:2;
}
.bf-step::after{content:'';position:absolute;top:15px;left:calc(50% + 9px);width:calc(100% - 18px);height:2px;background:#e5e9ee;z-index:1;}
.bf-step:last-child::after{display:none;}
.bf-step.done::before{background:var(--green);}
.bf-step.doing::before{background:var(--brand);box-shadow:0 0 0 4px rgba(6,182,212,.18);}
.bf-step.doing::after,.bf-step.done::after{background:var(--brand);}
.bf-step .bn{font-size:12px;font-weight:700;}
.bf-step .bs{font-size:11px;color:var(--t3);margin-top:2px;}
.batch-meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;}
.bm{background:#f6f8fa;border-radius:9px;padding:8px 12px;font-size:12px;color:var(--t2);flex:1;min-width:120px;}
.bm b{display:block;font-size:14px;color:var(--t1);margin-top:2px;font-variant-numeric:tabular-nums;}
/* 待办 */
.todo{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);}
.todo:last-child{border-bottom:none;}
.todo .dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:0 0 auto;}
.todo .dot.r{background:var(--red);}
.todo .dot.a{background:var(--amber);}
.todo .dot.c{background:var(--brand);}
.todo .tx{flex:1;font-size:13px;line-height:1.6;}
.todo .tx .tt{font-weight:600;}
.todo .tx .ts{font-size:11.5px;color:var(--t3);margin-top:1px;}
.todo .go{font-size:12px;color:var(--brand-dark);border:none;background:none;cursor:pointer;flex:0 0 auto;align-self:center;}
/* AI 晨报 */
.morning{
  background:linear-gradient(135deg,#0e7490,#06b6d4);border-radius:var(--radius);padding:16px 18px;color:#fff;margin-bottom:14px;
}
.morning .mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;}
.morning .mh b{font-size:13.5px;display:flex;align-items:center;gap:7px;}
.morning .mh span{font-size:11px;opacity:.85;}
.morning p{font-size:12.5px;line-height:1.85;opacity:.97;}
.morning p b{color:#fef08a;}
.morning .ask{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;}
.morning .ask button{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:99px;padding:5px 13px;font-size:12px;cursor:pointer;}
.morning .ask button:hover{background:rgba(255,255,255,.28);}
/* 底部 AI 输入条 */
.ai-bar{
  position:sticky;bottom:0;background:rgba(246,248,250,.9);backdrop-filter:blur(10px);
  padding:12px 26px 16px;border-top:1px solid var(--line);
}
.ai-box{
  background:#fff;border-radius:16px;box-shadow:var(--shadow-md);padding:11px 14px;
  display:flex;align-items:center;gap:10px;
}
.ai-box input{flex:1;border:none;outline:none;font-size:13.5px;background:none;color:var(--t1);}
.ai-box .chipbtn{border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--t2);font-size:12px;padding:5px 10px;cursor:pointer;display:flex;gap:5px;align-items:center;flex:0 0 auto;}
.ai-box .chipbtn:hover{border-color:var(--brand);color:var(--brand-dark);}
.ai-box .send{background:var(--brand);border:none;color:#fff;border-radius:10px;padding:8px 20px;font-size:13px;font-weight:600;cursor:pointer;flex:0 0 auto;}
.ai-box .send:hover{background:var(--brand-dark);}
.ai-note{font-size:10.5px;color:var(--t3);text-align:center;margin-top:8px;}
/* ===== 汇总表页 ===== */
.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
.page-head h1{font-size:19px;font-weight:700;letter-spacing:-.3px;}
.page-head .desc{font-size:12.5px;color:var(--t2);margin-top:4px;}
.page-head .acts{display:flex;gap:8px;flex-wrap:wrap;}
.btn{border:none;border-radius:9px;padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
.btn-primary{background:var(--brand);color:#fff;}
.btn-primary:hover{background:var(--brand-dark);}
.btn-dark{background:var(--t1);color:#fff;}
.btn-dark:hover{background:#333;}
.btn-outline{background:#fff;border:1px solid var(--line);color:var(--t2);}
.btn-outline:hover{border-color:var(--brand);color:var(--brand-dark);}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:7px;border:1px solid var(--line);background:#fff;color:var(--t2);cursor:pointer;}
.btn-link{background:none;border:none;color:var(--brand-dark);font-size:12px;cursor:pointer;padding:3px 5px;}
.btn-link.danger{color:var(--red);}
.stat-row{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px;}
.stat{background:#fff;border-radius:var(--radius);padding:12px 16px;border:1px solid var(--line);}
.stat .v{font-size:19px;font-weight:800;color:var(--brand-dark);font-variant-numeric:tabular-nums;}
.stat .k{font-size:11.5px;color:var(--t3);margin-top:2px;}
.tbl-wrap{background:#fff;border-radius:var(--radius);border:1px solid var(--line);overflow:auto;max-height:calc(100vh - 330px);}
table{border-collapse:collapse;min-width:100%;}
th,td{border:1px solid var(--line);padding:6px 8px;font-size:12.5px;white-space:nowrap;}
thead th{background:#fafbfc;position:sticky;top:0;z-index:5;font-weight:600;color:var(--t2);text-align:center;}
thead th.grp-prod{background:#f0fdff;color:var(--brand-deep);}
thead th.grp-fill{background:#fffbeb;color:var(--amber);}
thead th.grp-sum{background:var(--green-bg);color:var(--green);}
td input{width:100%;border:none;outline:none;font-size:12.5px;text-align:center;background:transparent;font-variant-numeric:tabular-nums;padding:2px 0;}
td input:focus{background:#f0fdff;border-radius:4px;}
td.num{text-align:right;font-variant-numeric:tabular-nums;}
td.qty-cell{background:#fffdf5;min-width:50px;}
td.calc{background:#f6fef8;text-align:right;font-variant-numeric:tabular-nums;color:var(--t2);}
td.final-cell{background:var(--green-bg);min-width:62px;}
td.final-cell input{font-weight:700;color:var(--green);}
td.amt{background:#f6fef8;text-align:right;font-weight:700;font-variant-numeric:tabular-nums;}
tr.disabled td{opacity:.45;background:#fafafa;}
tr.adding td{background:#f0fdff;}
tr.adding input{border:1px solid var(--brand);border-radius:6px;padding:4px 6px;background:#fff;}
.pname{font-weight:600;max-width:160px;overflow:hidden;text-overflow:ellipsis;}
.psub{font-size:10.5px;color:var(--t3);margin-top:1px;}
tfoot td{background:#fafbfc;font-weight:700;text-align:right;font-variant-numeric:tabular-nums;}
tfoot td:first-child{text-align:left;}
.rule-note{font-size:11.5px;color:var(--t2);margin-top:10px;line-height:1.8;}
.rule-note b{color:var(--amber);}
/* 数据接入页 */
.conn-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start;}
.conn-card{background:#fff;border-radius:var(--radius);border:1px solid var(--line);padding:16px 18px;}
.conn-card h3{font-size:14px;font-weight:700;margin-bottom:5px;display:flex;align-items:center;gap:8px;}
.conn-card .cd{font-size:12px;color:var(--t2);line-height:1.7;margin-bottom:12px;}
.conn-card .main-conn{border:1.5px solid var(--brand);border-radius:12px;padding:14px;background:var(--brand-bg);margin-bottom:10px;}
.conn-card .main-conn .mt{font-size:13.5px;font-weight:700;display:flex;align-items:center;justify-content:space-between;}
.conn-card .main-conn .ms{font-size:12px;color:var(--t2);margin-top:6px;line-height:1.7;}
.conn-card .other{border:1px dashed var(--line);border-radius:10px;padding:10px 14px;margin-top:8px;display:flex;align-items:center;justify-content:space-between;opacity:.75;}
.conn-card .other .ot{font-size:12.5px;color:var(--t2);}
.conn-card .other .ot span{font-size:10.5px;color:var(--t3);display:block;margin-top:1px;}
.tagchip{display:inline-block;font-size:10.5px;padding:2px 9px;border-radius:99px;font-weight:600;}
.tagchip.rec{background:var(--green-bg);color:var(--green);}
.tagchip.later{background:#f3f5f7;color:var(--t3);}
/* 弹窗 */
.mask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:400;display:none;align-items:flex-start;justify-content:center;padding:6vh 18px;overflow-y:auto;}
.mask.show{display:flex;}
.modal{background:#fff;border-radius:16px;width:100%;max-width:600px;animation:pop .2s ease;margin-bottom:6vh;box-shadow:var(--shadow-md);}
@keyframes pop{from{transform:scale(.96);opacity:0;}to{transform:scale(1);opacity:1;}}
.modal .mh{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line);}
.modal .mh h3{font-size:15.5px;}
.modal .mh .x{border:none;background:none;font-size:17px;color:var(--t3);cursor:pointer;}
.modal .mb{padding:18px 20px;}
.modal .mf{padding:12px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;}
.imp-sum{display:flex;gap:10px;margin-bottom:14px;}
.imp-sum .it{flex:1;background:#fafbfc;border:1px solid var(--line);border-radius:10px;padding:11px;text-align:center;}
.imp-sum .it b{font-size:19px;display:block;font-variant-numeric:tabular-nums;}
.imp-sum .it.ok b{color:var(--green);}
.imp-sum .it.dup b{color:var(--amber);}
.imp-sum .it span{font-size:11px;color:var(--t3);}
.imp-tbl{max-height:280px;overflow:auto;border:1px solid var(--line);border-radius:10px;}
.imp-tbl table{min-width:100%;}
.chip{display:inline-block;font-size:10.5px;padding:2px 8px;border-radius:99px;font-weight:600;white-space:nowrap;}
.chip.hz{background:var(--brand-light);color:var(--brand-deep);}
.chip.fb{background:rgba(139,92,246,.1);color:#7c3aed;}
.chip.off{background:#f3f4f6;color:var(--t3);}
.chip.green{background:var(--green-bg);color:var(--green);}
.toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%) translateY(8px);background:rgba(23,23,23,.92);color:#fff;font-size:13px;padding:10px 20px;border-radius:99px;opacity:0;pointer-events:none;transition:all .25s;z-index:500;max-width:85%;text-align:center;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
@media(max-width:1100px){.work-grid{grid-template-columns:1fr;}.kpi-grid{grid-template-columns:repeat(2,1fr);}.conn-grid{grid-template-columns:1fr;}}
</style>
</head>
<body>

<!-- 蓝图说明条 -->
<div class="blueprint-bar">
  <span class="tag">UI 改造蓝图 v1</span>
  <span>hergent.cn 改造后形态：<b>首屏=经营工作台</b> · <b>预报订货管理=汇总表</b> · 测试遗留已清理 · 金蝶/用友/畅捷通已降级</span>
  <span style="margin-left:auto;opacity:.7;">视觉语言沿用现有品牌青/大圆角，不重做</span>
</div>

<div class="layout">
  <!-- 左侧导航（改造后：业务流程优先） -->
  <aside class="sidebar">
    <div class="sb-head">
      <div class="logo">H</div>
      <div class="tx"><b>Hergent</b><span>鑫源乳业（襄阳）</span></div>
    </div>
    <div class="sb-search">🔍 搜索功能、商品、对话…</div>
    <div class="sb-scroll">
      <div class="sb-group">
        <div class="gh">经营</div>
        <div class="sb-item active" data-page="workbench">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="8" height="10" rx="2"/><rect x="13" y="3" width="8" height="6" rx="2"/><rect x="13" y="11" width="8" height="10" rx="2"/><rect x="3" y="15" width="8" height="6" rx="2"/></svg>
          经营工作台
        </div>
        <div class="sb-item" data-page="forecast">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h10"/><circle cx="19" cy="18" r="2.4"/></svg>
          预报订货管理 <span class="nbadge cyan">今</span>
        </div>
      </div>
      <div class="sb-group">
        <div class="gh">数据与连接</div>
        <div class="sb-item" data-page="data">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><ellipse cx="12" cy="5.5" rx="7" ry="2.8"/><path d="M5 5.5v6c0 1.6 3.1 2.8 7 2.8s7-1.2 7-2.8v-6"/><path d="M5 11.5v6c0 1.6 3.1 2.8 7 2.8s7-1.2 7-2.8v-6"/></svg>
          数据接入中心
        </div>
        <div class="sb-item">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3.2 2"/></svg>
          定时任务
        </div>
        <div class="sb-item">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 3 5 7l4 4"/><path d="M5 7h9a5 5 0 0 1 5 5v1"/><path d="m15 21 4-4-4-4"/><path d="M19 17h-9a5 5 0 0 1-5-5v-1"/></svg>
          连接中心
        </div>
      </div>
      <div class="sb-group">
        <div class="gh">其他</div>
        <div class="sb-item">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><rect x="4" y="17" width="16" height="4" rx="1.5"/></svg>
          我的成果

function rowCalc(p){
  const q=state.qty[p.id]||{};
  const total=Object.values(q).reduce((s,v)=>s+(Number(v)||0),0);
  const cases=total/p.spec;
  const roundCases=Math.ceil(cases);
  const extra=Number(state.extra[p.id])||0;
  const final=(p.id in state.final)?Number(state.final[p.id]):roundCases+extra;
  return {total,cases,roundCases,extra,final,amt:final*p.price};
}
function calcAll(){
  let forecastAmt=0,finalAmt=0,submitted=0;

  state.products.forEach(p=>{

    Object.keys(state.qty[p.id]||{}).forEach(u=>reported.add(u));

  });

}

function bindForecastInputs(){
  document.querySelectorAll('[data-cell]').forEach(inp=>inp.addEventListener('change',e=>{
    const [pid,uid]=e.target.dataset.cell.split('|');
    const v=Math.max(0,Math.floor(Number(e.target.value)||0));
    if(!state.qty[pid])state.qty[pid]={};
    if(v)state.qty[pid][uid]=v;else delete state.qty[pid][uid];
    delete state.final[pid];render();
  }));
  document.querySelectorAll('[data-extra]').forEach(inp=>inp.addEventListener('change',e=>{
    const pid=e.target.dataset.extra;
    const v=Math.max(0,Math.floor(Number(e.target.value)||0));
    state.extra[pid]=v;delete state.final[pid];render();
  }));
  document.querySelectorAll('[data-final]').forEach(inp=>inp.addEventListener('change',e=>{
    const pid=e.target.dataset.final;
    const v=Number(e.target.value);
    if(!Number.isInteger(v)||v<0){toast('最终下单必须是非负整数（整箱）');render();return;}
    state.final[pid]=v;render();
  }));
  document.querySelectorAll('[data-disable]').forEach(b=>b.addEventListener('click',()=>{
    const p=state.products.find(x=>x.id===b.dataset.disable);p.status='off';render();
    toast(`「${p.name}（${p.channel}）」已停用，小程序端不再显示`);
  }));
  document.querySelectorAll('[data-enable]').forEach(b=>b.addEventListener('click',()=>{
    const p=state.products.find(x=>x.id===b.dataset.enable);p.status='on';render();toast(`「${p.name}」已重新启用`);
  }));
}

/* ================= Excel 导入弹窗 ================= */
function openImport(){
  const news=IMPORT_NEW.filter(x=>!x.verdict);
  showModal(`
    <div class="mh"><h3>上传下单表 Excel · 解析商品行</h3><button class="x" data-close>✕</button></div>
    <div class="mb">
      <div style="border:1.5px dashed var(--line);border-radius:12px;padding:16px;text-align:center;margin-bottom:14px;background:#fafbfc;">
        <div style="font-size:24px;">📄</div>
        <div style="font-size:13px;font-weight:600;margin:5px 0 3px;">最新26年8月下单表.xlsx</div>
        <div style="font-size:11.5px;color:var(--t3);">演示模式：已模拟解析最新工作表「${BATCH.name}」的商品行</div>
      </div>
      <div class="imp-sum">
        <div class="it ok"><b>${news.length}</b><span>新条码 · 将新增入库</span></div>
        <div class="it dup"><b>${IMPORT_NEW.length-news.length}</b><span>条码+通道已存在 · 跳过</span></div>
      </div>
      <div class="imp-tbl"><table>
        <thead><tr><th>条码</th><th>简称</th><th>每箱件数</th><th>通道</th><th>单价</th><th>结果</th></tr></thead>
        <tbody>
          ${IMPORT_NEW.map(x=>`<tr>
            <td style="color:var(--t3);font-size:11.5px;">${x.barcode}</td>
            <td style="font-weight:600;">${x.name}</td>
            <td style="text-align:center;">${x.spec}</td>
            <td style="text-align:center;"><span class="chip ${x.channel==='恒滋'?'hz':'fb'}">${x.channel}</span></td>
            <td style="text-align:right;">${fmt(x.price)}</td>
            <td>${x.verdict?'<span class="chip off">重复跳过</span>':'<span class="chip green">新增</span>'}</td>
          </tr>`).join('')}
        </tbody>
      </table></div>
      <div style="font-size:11.5px;color:var(--t3);margin-top:10px;">导入即新增商品行，小程序报单端立即可见可报。</div>
    </div>
    <div class="mf">
      <button class="btn btn-outline" data-close>取消</button>
      <button class="btn btn-primary" data-act="confirm-import" data-primary-action>确认导入 ${news.length} 个新商品</button>
    </div>`);
}

/* ================= 渲染调度 ================= */
function render(){
  const ms=$('#mainScroll');
  if(state.page==='workbench')ms.innerHTML=renderWorkbench();
  else if(state.page==='forecast'){ms.innerHTML=renderForecast();bindForecastInputs();}
  else if(state.page==='data')ms.innerHTML=renderData();
  document.querySelectorAll('.sb-item[data-page]').forEach(el=>el.classList.toggle('active',el.dataset.page===state.page));
  ms.scrollTop=0;
}

/* ================= 事件 ================= */
document.querySelectorAll('.sb-item[data-page]').forEach(el=>el.addEventListener('click',()=>{state.page=el.dataset.page;render();}));
document.addEventListener('click',e=>{
  const go=e.target.closest('[data-go]');
  if(go){state.page=go.dataset.go;render();return;}
  const ask=e.target.closest('[data-ask]');
  if(ask){$('#aiInput').value=ask.dataset.ask;$('#aiInput').focus();toast('已填入 AI 输入框，真实版将走 Hermes 引擎回答');return;}
  const el=e.target.closest('[data-act],[data-close]');
  if(!el)return;
  if(el.hasAttribute('data-close')){hideModal();return;}
  const act=el.dataset.act;
  if(act==='open-import'){openImport();return;}
  if(act==='confirm-import'){
    let n=0;
    IMPORT_NEW.forEach(x=>{
      if(x.verdict)return;
      if(state.products.find(p=>p.barcode===x.barcode&&p.channel===x.channel))return;
      state.products.push({id:'p'+Date.now()+n,barcode:x.barcode,name:x.name,spec:x.spec,channel:x.channel,price:x.price,yonghui:'',status:'on'});
      n++;
    });
    hideModal();render();toast(`导入完成：新增 ${n} 个商品行，小程序端已同步`);return;
  }
  if(act==='add-row'){state._adding=true;render();setTimeout(()=>$('#nName')?.focus(),50);return;}
  if(act==='add-row-cancel'){state._adding=false;render();return;}
  if(act==='add-row-save'){
    const name=$('#nName').value.trim(),price=parseFloat($('#nPrice').value),spec=parseInt($('#nSpec').value,10);
    const barcode=$('#nBarcode').value.trim(),channel=$('#nChannel').value;
    if(!name){toast('请填写商品简称');return;}
    if(!(price>0)){toast('请填写单价');return;}
    if(!(spec>0)){toast('请填写每箱件数（规格）');return;}
    state.products.push({id:'p'+Date.now(),barcode:barcode||'',name,spec,channel,price,yonghui:'',status:'on'});
    state._adding=false;render();toast(`已新增「${name}（${channel}下单）」，小程序端同步可见`);return;
  }
  if(act==='gen-template'){toast('定稿后一键生成舟谱导入 CSV（确定性模板，字段固定可复现）');return;}
  if(act==='urge'){toast('已通过企微@未报单成员（演示）：唐成、黄家伟…');return;}
});

/* ================= 启动 ================= */
render();
</script>
