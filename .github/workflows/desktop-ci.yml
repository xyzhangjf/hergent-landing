name: Desktop CI

on:
  push:
    paths:
      - "desktop-app/**"
  pull_request:
    paths:
      - "desktop-app/**"

defaults:
  run:
    working-directory: desktop-app

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: desktop-app/package-lock.json

      - run: npm ci
      - run: npm run check
      - run: npm run format:check
      - run: npm run lint
      - run: npm run audit
      - run: npm run typecheck

  build:
    needs: verify
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: desktop-app/package-lock.json

      - run: npm ci
      - run: npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: hergent-mac-arm64
          path: desktop-app/release/*.dmg
