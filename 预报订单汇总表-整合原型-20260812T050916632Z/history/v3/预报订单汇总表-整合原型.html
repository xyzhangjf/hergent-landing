<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>预报订单汇总表 · 整合原型（多租户版）</title>
<style>
:root{
  --brand:#06b6d4;--brand-dark:#0891b2;--brand-light:rgba(6,182,212,.08);--brand-bg:rgba(6,182,212,.05);
  --bg:#f4f5f7;--card:#fff;--line:#e6e8ec;
  --t1:#171717;--t2:#4d4d4d;--t3:#8a8f98;
  --green:#16a34a;--green-bg:#eefbf1;--red:#dc2626;--red-bg:#fef2f2;--amber:#d97706;--amber-bg:#fff7e8;
  --radius:12px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--t1);font-size:14px;}
/* ===== 顶部模式切换 ===== */
.mode-bar{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:10px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.mode-bar .logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;}
.mode-bar .logo .ic{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#0e7490,var(--brand));color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;}
.mode-sw{display:flex;background:#f1f2f5;border-radius:99px;padding:3px;margin-left:4px;}
.mode-sw button{border:none;background:none;padding:7px 16px;border-radius:99px;font-size:13px;font-weight:600;color:var(--t3);cursor:pointer;white-space:nowrap;}
.mode-sw button.on{background:#fff;color:var(--brand-dark);box-shadow:0 1px 4px rgba(15,23,42,.12);}
.mode-bar .right{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--t2);}
.mode-bar select{font-size:12px;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--t1);outline:none;}
.mode-bar .demo-hint{color:var(--t3);}
/* ===== 通用按钮/组件 ===== */
.btn{border:none;border-radius:9px;padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
.btn-primary{background:var(--brand);color:#fff;}
.btn-primary:hover{background:var(--brand-dark);}
.btn-primary:disabled{background:#cbd5e1;color:#fff;cursor:not-allowed;}
.btn-dark{background:var(--t1);color:#fff;}
.btn-dark:hover{background:#333;}
.btn-outline{background:#fff;border:1px solid var(--line);color:var(--t2);}
.btn-outline:hover{border-color:var(--brand);color:var(--brand-dark);}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:7px;border:1px solid var(--line);background:#fff;color:var(--t2);cursor:pointer;}
.btn-sm:active{background:#f3f4f6;}
.btn-sm.danger{color:var(--red);border-color:rgba(220,38,38,.3);}
.btn-link{background:none;border:none;color:var(--brand-dark);font-size:12px;cursor:pointer;padding:3px 5px;}
.btn-link:hover{text-decoration:underline;}
.btn-link.danger{color:var(--red);}
.btn-ghost{font-size:12px;color:var(--brand-dark);background:#fff;border:1px solid rgba(6,182,212,.4);border-radius:8px;padding:6px 12px;cursor:pointer;}
.btn-ghost:active{background:var(--brand-light);}
.chip{display:inline-block;font-size:10.5px;padding:2px 8px;border-radius:99px;font-weight:600;white-space:nowrap;}
.chip.hz{background:var(--brand-light);color:var(--brand-dark);}
.chip.fb{background:rgba(139,92,246,.1);color:#7c3aed;}
.chip.off{background:#f3f4f6;color:var(--t3);}
.chip.green{background:var(--green-bg);color:var(--green);}
.chip.warn{background:var(--amber-bg);color:var(--amber);}
.field label{display:block;font-size:12px;color:var(--t3);margin-bottom:4px;}
.field label b{color:var(--red);}
.field input,.field select{width:100%;padding:8px 11px;border:1px solid var(--line);border-radius:9px;font-size:13px;outline:none;background:#fafbfc;}
.field input:focus,.field select:focus{border-color:var(--brand);background:#fff;}
/* ===== Web 汇总页 ===== */
.web-wrap{padding:18px 20px 60px;}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
.page-head h1{font-size:19px;font-weight:700;}
.page-head .desc{font-size:12.5px;color:var(--t3);margin-top:3px;}
.page-head .acts{display:flex;gap:8px;flex-wrap:wrap;}
.stat-row{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px;}
.stat{background:#fff;border-radius:var(--radius);padding:12px 16px;border:1px solid var(--line);}
.stat .v{font-size:19px;font-weight:800;color:var(--brand-dark);font-variant-numeric:tabular-nums;}
.stat .k{font-size:11.5px;color:var(--t3);margin-top:2px;}
.tbl-wrap{background:#fff;border-radius:var(--radius);border:1px solid var(--line);overflow:auto;max-height:calc(100vh - 300px);}
table{border-collapse:collapse;min-width:100%;}
th,td{border:1px solid var(--line);padding:6px 8px;font-size:12.5px;white-space:nowrap;}
thead th{background:#fafbfc;position:sticky;top:0;z-index:5;font-weight:600;color:var(--t2);text-align:center;}
thead th.grp-prod{background:#f0fdff;color:var(--brand-dark);}
thead th.grp-fill{background:#fff7e8;color:var(--amber);}
thead th.grp-sum{background:#eefbf1;color:var(--green);}
td input{width:100%;border:none;outline:none;font-size:12.5px;text-align:center;background:transparent;font-variant-numeric:tabular-nums;padding:2px 0;}
td input:focus{background:#f0fdff;border-radius:4px;}
td.num{text-align:right;font-variant-numeric:tabular-nums;}
td.qty-cell{background:#fffdf5;min-width:52px;}
td.calc{background:#f6fef8;text-align:right;font-variant-numeric:tabular-nums;color:var(--t2);}
td.final-cell{background:#eefbf1;min-width:64px;}
td.final-cell input{font-weight:700;color:var(--green);}
td.amt{background:#f6fef8;text-align:right;font-weight:700;font-variant-numeric:tabular-nums;}
tr.disabled td{opacity:.45;background:#fafafa;}
tr.adding td{background:#f0fdff;}
tr.adding input{border:1px solid var(--brand);border-radius:6px;padding:4px 6px;background:#fff;}
.pname{font-weight:600;max-width:170px;overflow:hidden;text-overflow:ellipsis;}
.psub{font-size:10.5px;color:var(--t3);margin-top:1px;}
tfoot td{background:#fafbfc;font-weight:700;text-align:right;font-variant-numeric:tabular-nums;}
tfoot td:first-child{text-align:left;}
.rule-note{font-size:11.5px;color:var(--t3);margin-top:10px;line-height:1.8;}
.rule-note b{color:var(--amber);}
/* ===== 手机壳（小程序端） ===== */
.mobile-wrap{display:none;justify-content:center;align-items:flex-start;padding:20px 12px 40px;}
.mobile-wrap.on{display:flex;}
.phone{width:420px;max-width:100%;height:calc(100vh - 100px);min-height:620px;max-height:880px;background:#f6f7f9;border-radius:32px;overflow:hidden;box-shadow:0 24px 64px rgba(15,23,42,.28),0 0 0 1px rgba(15,23,42,.06);display:flex;flex-direction:column;position:relative;}
.wx-nav{height:46px;flex:0 0 46px;background:#fff;display:flex;align-items:center;padding:0 12px;position:relative;border-bottom:1px solid var(--line);}
.wx-nav .title{position:absolute;left:50%;transform:translateX(-50%);font-size:16px;font-weight:600;}
.capsule{margin-left:auto;display:flex;align-items:center;gap:0;border:1px solid rgba(0,0,0,.12);border-radius:20px;padding:4px 10px;font-size:12px;color:var(--t2);background:rgba(255,255,255,.9);}
.capsule .sep{width:1px;height:12px;background:rgba(0,0,0,.12);margin:0 8px;}
.user-bar{background:#fff;padding:8px 14px;display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line);flex:0 0 auto;}
.user-bar .avatar{width:34px;height:34px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;flex:0 0 auto;}
.user-bar .info{flex:1;min-width:0;}
.user-bar .info .nm{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.user-bar .info .rl{font-size:11px;color:var(--t3);}
.user-bar .tenant-name{font-size:11px;color:var(--brand-dark);background:var(--brand-light);border-radius:4px;padding:1px 7px;flex:0 0 auto;}
.user-bar .logout{font-size:11px;color:var(--t3);cursor:pointer;border:none;background:none;}
.batch{margin:12px;border-radius:var(--radius);padding:14px 16px;color:#fff;background:linear-gradient(135deg,#0e7490,var(--brand));flex:0 0 auto;box-shadow:0 8px 20px rgba(6,182,212,.22);}
.batch.closed{background:linear-gradient(135deg,#475569,#64748b);box-shadow:none;}
.batch .row1{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.batch .no{font-size:14px;font-weight:700;letter-spacing:.3px;}
.batch .state{font-size:11px;padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.22);}
.batch .row2{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;opacity:.95;}
.batch .cd{font-variant-numeric:tabular-nums;font-weight:700;color:#fff;}
.batch .toggle{margin-top:10px;font-size:11px;color:rgba(255,255,255,.9);background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);border-radius:8px;padding:4px 10px;cursor:pointer;}
.closed-banner{margin:12px 12px 0;background:#fff7e8;color:var(--amber);border:1px solid #fde6c8;border-radius:10px;padding:10px 12px;font-size:12.5px;}
main{flex:1;overflow-y:auto;padding:0 12px 16px;-webkit-overflow-scrolling:touch;}
.panel{background:var(--card);border-radius:var(--radius);padding:14px;margin-top:12px;}
.panel h3{font-size:14px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
.panel h3 .sub{font-size:11px;color:var(--t3);font-weight:400;}
.search{display:flex;align-items:center;gap:8px;background:#f3f4f6;border-radius:99px;padding:9px 14px;}
.search input{flex:1;border:none;background:none;outline:none;font-size:14px;color:var(--t1);}
.search svg{flex:0 0 auto;color:var(--t3);}
.fav-row{display:flex;gap:8px;overflow-x:auto;padding:10px 2px 2px;scrollbar-width:none;}
.fav-row::-webkit-scrollbar{display:none;}
.fav{flex:0 0 auto;font-size:12px;padding:6px 12px;border-radius:99px;cursor:pointer;background:var(--brand-light);color:var(--brand-dark);border:1px solid rgba(6,182,212,.25);}
.fav:active{transform:scale(.96);}
.sku{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);align-items:flex-start;}
.sku:last-child{border-bottom:none;padding-bottom:2px;}
.sku .emoji{width:42px;height:42px;border-radius:10px;background:var(--brand-light);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;color:var(--brand-dark);flex:0 0 auto;}
.sku .info{flex:1;min-width:0;}
.sku .name{font-size:14px;font-weight:600;line-height:1.3;}
.sku .spec{font-size:11.5px;color:var(--t3);margin-top:3px;}
.sku .ctrl{flex:0 0 auto;text-align:right;}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:99px;overflow:hidden;background:#fff;}
.step button{width:30px;height:30px;border:none;background:none;font-size:16px;color:var(--t2);cursor:pointer;line-height:1;}
.step button:active{background:#f3f4f6;}
.step .q{min-width:34px;text-align:center;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;}
.cart-item{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);}
.cart-item:last-child{border-bottom:none;}
.cart-item .ci-name{flex:1;min-width:0;font-size:13px;font-weight:600;}
.cart-item .ci-sub{font-size:11px;color:var(--t3);margin-top:2px;font-weight:400;}
.cart-item .del{flex:0 0 auto;width:24px;height:24px;border:none;border-radius:50%;background:var(--red-bg);color:var(--red);font-size:13px;cursor:pointer;}
.total-bar{position:sticky;bottom:0;margin-top:12px;background:#fff;border-radius:var(--radius);padding:12px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 -4px 16px rgba(15,23,42,.08),0 0 0 1px var(--line);}
.total-bar .t{flex:1;font-size:13px;color:var(--t2);}
.total-bar .t b{font-size:17px;color:var(--t1);margin:0 2px;font-variant-numeric:tabular-nums;}
.sub-card{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px;}
.sub-card .head{display:flex;justify-content:space-between;align-items:center;font-size:13px;}
.sub-card .meta{font-size:11.5px;color:var(--t3);margin-top:6px;}
.sub-card .items{font-size:12.5px;margin-top:8px;line-height:1.9;}
.sub-card .items b{color:var(--brand-dark);}
.privacy-note{text-align:center;font-size:10.5px;color:var(--t3);padding:14px 0 4px;line-height:1.7;}
.tabbar{flex:0 0 auto;background:#fff;border-top:1px solid var(--line);display:flex;padding:6px 0 calc(8px + env(safe-area-inset-bottom));}
.tabbar button{flex:1;border:none;background:none;cursor:pointer;color:var(--t3);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;position:relative;}
.tabbar button.active{color:var(--brand-dark);font-weight:600;}
.tabbar .badge{position:absolute;top:-3px;right:calc(50% - 20px);background:var(--red);color:#fff;font-size:10px;min-width:16px;height:16px;border-radius:99px;display:flex;align-items:center;justify-content:center;padding:0 4px;}
.empty{text-align:center;padding:40px 0;color:var(--t3);}
.empty .big{font-size:40px;margin-bottom:8px;}
.empty p{font-size:13px;line-height:1.8;}
/* 多租户专属 */
.auth-screen{flex:1;display:flex;flex-direction:column;overflow-y:auto;}
.auth-inner{padding:34px 26px 24px;flex:1;}
.auth-logo{text-align:center;margin-bottom:26px;}
.auth-logo .icon{font-size:46px;margin-bottom:8px;}
.auth-logo h2{font-size:21px;font-weight:700;letter-spacing:-.5px;}
.auth-logo p{font-size:12.5px;color:var(--t3);margin-top:4px;}
.auth-footer{text-align:center;padding:10px 0;font-size:11px;color:var(--t3);}
.auth-footer a{color:var(--brand-dark);}
.divider{display:flex;align-items:center;gap:10px;margin:18px 0;font-size:12px;color:var(--t3);}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--line);}
.quick-tenant{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
.quick-tenant button{font-size:11.5px;padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--t2);cursor:pointer;}
.quick-tenant button:active{background:var(--brand-light);border-color:var(--brand);}
.sms-row{display:flex;gap:8px;}
.sms-row input{flex:1;}
.step-indicator{display:flex;gap:4px;margin-bottom:20px;}
.step-dot{flex:1;height:3px;border-radius:2px;background:var(--line);}
.step-dot.active{background:var(--brand);}
.link-reset{font-size:11px;color:var(--t3);background:none;border:none;cursor:pointer;text-decoration:underline;}
.member-card{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);}
.member-card:last-child{border-bottom:none;}
.member-card .av{width:38px;height:38px;border-radius:50%;background:var(--brand-light);color:var(--brand-dark);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;flex:0 0 auto;}
.member-card .mi{flex:1;min-width:0;}
.member-card .mi .mn{font-size:13.5px;font-weight:600;}
.member-card .mi .mr{font-size:11px;color:var(--t3);margin-top:2px;}
.member-card select{font-size:12px;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--t1);}
.member-card .del-m{border:none;background:none;color:var(--t3);font-size:16px;cursor:pointer;padding:4px;}
.member-card .del-m:hover{color:var(--red);}
.invite-box{background:var(--brand-bg);border:1.5px dashed rgba(6,182,212,.35);border-radius:12px;padding:14px;margin-top:12px;text-align:center;}
.invite-box .code{font-size:28px;font-weight:800;letter-spacing:4px;color:var(--brand-dark);margin:8px 0;font-family:monospace;}
.invite-box .desc{font-size:12px;color:var(--t2);margin-bottom:10px;}
.usage-bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px;}
.usage-bar .fill{height:100%;border-radius:3px;background:var(--brand);transition:width .3s;}
.plan-cards{display:flex;gap:8px;margin-top:10px;}
.plan{flex:1;background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center;cursor:pointer;}
.plan.on{border-color:var(--brand);box-shadow:0 4px 16px rgba(6,182,212,.15);}
.plan .pn{font-size:13px;font-weight:700;}
.plan .pp{font-size:20px;font-weight:800;color:var(--brand-dark);margin:5px 0;}
.plan .pp small{font-size:11px;font-weight:400;color:var(--t3);}
.plan .pd{font-size:10.5px;color:var(--t3);line-height:1.6;text-align:left;margin-top:6px;}
.plan .tag{display:inline-block;font-size:10px;padding:2px 8px;border-radius:99px;background:rgba(22,163,74,.1);color:var(--green);margin-bottom:4px;}
/* 弹窗/Toast */
.mask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:200;display:none;align-items:flex-start;justify-content:center;padding:6vh 18px;overflow-y:auto;}
.mask.show{display:flex;}
.modal{background:#fff;border-radius:16px;width:100%;max-width:600px;animation:pop .2s ease;margin-bottom:6vh;}
.phone-modal{background:#fff;border-radius:18px;padding:26px 22px;width:100%;max-width:320px;text-align:center;animation:pop .22s ease;}
@keyframes pop{from{transform:scale(.9);opacity:0;}to{transform:scale(1);opacity:1;}}
.modal .mh{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line);}
.modal .mh h3{font-size:15.5px;}
.modal .mh .x{border:none;background:none;font-size:17px;color:var(--t3);cursor:pointer;}
.modal .mb{padding:18px 20px;}
.modal .mf{padding:12px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;}
.phone-modal .ok{width:52px;height:52px;border-radius:50%;background:var(--green-bg);color:var(--green);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-size:26px;}
.phone-modal h4{font-size:17px;margin-bottom:6px;}
.phone-modal p{font-size:12.5px;color:var(--t2);line-height:1.8;}
.phone-modal .btn-primary{margin-top:16px;width:100%;}
.imp-sum{display:flex;gap:10px;margin-bottom:14px;}
.imp-sum .it{flex:1;background:#fafbfc;border:1px solid var(--line);border-radius:10px;padding:11px;text-align:center;}
.imp-sum .it b{font-size:19px;display:block;font-variant-numeric:tabular-nums;}
.imp-sum .it.ok b{color:var(--green);}
.imp-sum .it.dup b{color:var(--amber);}
.imp-sum .it span{font-size:11px;color:var(--t3);}
.imp-tbl{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:10px;}
.imp-tbl table{min-width:100%;}
.toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%) translateY(8px);background:rgba(23,23,23,.92);color:#fff;font-size:13px;padding:10px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:all .25s;max-width:80%;text-align:center;z-index:60;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast-global{position:fixed;left:50%;bottom:32px;transform:translateX(-50%) translateY(8px);background:rgba(23,23,23,.92);color:#fff;font-size:13px;padding:10px 20px;border-radius:99px;opacity:0;pointer-events:none;transition:all .25s;z-index:300;max-width:85%;text-align:center;}
.toast-global.show{opacity:1;transform:translateX(-50%) translateY(0);}
@media(max-width:900px){.stat-row{grid-template-columns:repeat(2,1fr);}}
@media(max-width:480px){.phone{border-radius:0;box-shadow:none;height:calc(100vh - 62px);}}
</style>
</head>
<body>

<!-- 顶部模式切换 -->
<div class="mode-bar">
  <div class="logo"><span class="ic">🧊</span>预报订单汇总表</div>
  <div class="mode-sw">
    <button id="modeWeb" class="on" data-mode="web">Web 汇总表（含价格 · 经理视角）</button>
    <button id="modeMobile" data-mode="mobile">小程序报单端（无价格 · 一线视角）</button>
  </div>
  <div class="right">
    <span>Web 端查看租户：</span>
    <select id="webTenantSel"></select>
    <span>🔄 小程序演示账号：</span>
    <select id="demoSwitch"></select>
    <span class="demo-hint">数据存当前浏览器</span>
  </div>
</div>

function productsOf(tid){return db.products[tid]||(db.products[tid]=[]);}
const productOf=id=>productsOf(webTenantId).find(p=>p.id===id);
function rowCalc(tid,p){
  const q=(db.qty[tid]||{})[p.id]||{};
  const total=Object.values(q).reduce((s,v)=>s+(Number(v)||0),0);
  const cases=total/p.spec;
  const roundCases=Math.ceil(cases);
  const extra=Number((db.extra[tid]||{})[p.id])||0;
  const final=((db.final[tid]||{})[p.id]!==undefined)?Number(db.final[tid][p.id]):roundCases+extra;
  return {total,cases,roundCases,extra,final,amt:final*p.price};
}

    const c=rowCalc(tid,p);
    if(p.status==='on')totals.amt+=c.total*p.price;
    totals.finalAmt+=c.amt;
    const disabled=p.status==='off';
    return `<tr class="${disabled?'disabled':''}">
      <td style="color:var(--t3);font-size:11px;">${p.barcode}</td>
      <td><div class="pname">${p.name}</div><div class="psub">规格 ${p.spec}件/箱${p.yonghui?' · 永辉'+p.yonghui:''}</div></td>

        const v=(db.qty[tid][p.id]||{})[m.userId];
        return `<td class="qty-cell"><input inputmode="numeric" data-cell="${p.id}|${m.userId}" value="${v||''}" placeholder="·" ${disabled?'disabled':''}></td>`;

      <td class="calc">${c.total?(Math.round(c.cases*10)/10):''}</td>
      <td class="calc">${c.total?c.roundCases:''}</td>
      <td class="qty-cell"><input inputmode="numeric" data-extra="${p.id}" value="${c.extra||''}" placeholder="0" ${disabled?'disabled':''}></td>
      <td class="final-cell"><input inputmode="numeric" data-final="${p.id}" value="${c.final}" ${disabled?'disabled':''}></td>
      <td class="amt">${c.final?fmt(c.amt):''}</td>
      <td style="text-align:center;">${disabled
        ?`<button class="btn-link" data-act="enable" data-id="${p.id}">启用</button>`
        :`<button class="btn-link danger" data-act="disable" data-id="${p.id}">停用</button>`}</td>
    </tr>`;
  }).join('');
  const addRow=`<tr class="adding">
    <td><input id="nBarcode" placeholder="条码"></td>
    <td><input id="nName" placeholder="简称 *"></td>
    <td><select id="nChannel" style="border:1px solid var(--brand);border-radius:6px;font-size:12px;padding:3px;"><option>恒滋</option><option>福宝</option></select></td>
    <td><input id="nPrice" placeholder="单价 *" inputmode="decimal"></td>
    <td colspan="${members.length}" style="text-align:center;color:var(--t3);font-size:12px;">← 新增商品后，报单列自动可用</td>
    <td><input id="nSpec" placeholder="每箱件数 *" inputmode="numeric" style="min-width:70px;"></td>
    <td colspan="5"></td>
    <td style="text-align:center;"><button class="btn btn-sm btn-primary" data-act="add-row-save">保存</button> <button class="btn-link" data-act="add-row-cancel">取消</button></td>
  </tr>`;
  $('#webWrap').innerHTML=`
  <div class="page-head">
    <div>
      <h1>${tenant.name} · ${BATCH.name}</h1>
      <div class="desc">预报汇总 / 下单表 · 商品管理就在这张表里：上传下单表 Excel 批量导入、表内加行新增、停用的小程序端自动隐藏</div>
    </div>
    <div class="acts">
      <button class="btn btn-outline" data-act="open-import" data-primary-action>📥 上传下单表 Excel 导入商品</button>
      <button class="btn btn-dark" data-act="add-row">＋ 加行新增商品</button>
    </div>
  </div>
  <div class="stat-row">
    <div class="stat"><div class="v">${prods.filter(p=>p.status==='on').length}<small style="font-size:12px;color:var(--t3);">/${prods.length}</small></div><div class="k">在售 SKU / 全部</div></div>
    <div class="stat"><div class="v">${fmt0(totals.amt.toFixed(0))}</div><div class="k">预报合计（按单价估算）</div></div>
    <div class="stat"><div class="v">${fmt0(totals.finalAmt.toFixed(0))}</div><div class="k">最终下单金额</div></div>
    <div class="stat"><div class="v">${members.filter(m=>!m.store).length} 人 / ${members.filter(m=>m.store).length} 店</div><div class="k">报单成员 / 门店</div></div>
    <div class="stat"><div class="v">恒滋 / 福宝</div><div class="k">下单通道（给厂家分单）</div></div>
  </div>
  ${prods.length?`
  <div class="tbl-wrap">
    <table>
      <thead>
        <tr>
          <th class="grp-prod" rowspan="2" style="min-width:110px;">条码</th>
          <th class="grp-prod" rowspan="2" style="min-width:150px;">商品（简称）</th>
          <th class="grp-prod" rowspan="2">下单<br>通道</th>
          <th class="grp-prod" rowspan="2">单价<br>(元/箱)</th>
          <th class="grp-fill" colspan="${members.length}">报单列（小程序提交自动回填 · 最小单位）</th>
          <th class="grp-sum" colspan="3">自动汇总</th>
          <th class="grp-sum" rowspan="2">加单<br>(整箱)</th>
          <th class="grp-sum" rowspan="2">最终下单<br>(整箱)</th>
          <th class="grp-sum" rowspan="2">下单金额</th>
          <th rowspan="2">状态</th>
        </tr>
        <tr>
          ${members.map(m=>`<th class="grp-fill" style="min-width:46px;">${m.name}${m.store?'<br><span style="font-size:9px;color:var(--t3);">店</span>':''}</th>`).join('')}

      </thead>
      <tbody>${rows}${webAdding?addRow:''}</tbody>
      <tfoot><tr>
        <td colspan="4">总合计</td>
        ${members.map(m=>{
          const s=prods.reduce((t,p)=>t+((db.qty[tid][p.id]||{})[m.userId]||0),0);
          return `<td style="text-align:center;">${s||''}</td>`;
        }).join('')}
        <td>${fmt0(prods.reduce((t,p)=>t+rowCalc(tid,p).total,0))}</td>
        <td></td><td></td>
        <td>${fmt0(prods.reduce((t,p)=>t+rowCalc(tid,p).extra,0))}</td>
        <td>${fmt0(prods.reduce((t,p)=>t+rowCalc(tid,p).final,0))}</td>
        <td>${fmt(totals.finalAmt)}</td>

    ③ 给厂家下单取整为整箱——"整箱建议"为向上取整，业务经理可在"最终下单"列改为任意整箱数；④ 同条码按下单通道（恒滋/福宝）分行，给厂家分单不混淆。
  </div>`:`

    <p>${tenant.name} 还没有商品<br>请先「上传下单表 Excel 导入商品」或「加行新增商品」<br>导入后小程序端自动可见可报</p>
  </div>`}`;

}
let webAdding=false;
function bindWebInputs(){
  document.querySelectorAll('[data-cell]').forEach(inp=>inp.addEventListener('change',e=>{
    const [pid,uid]=e.target.dataset.cell.split('|');
    const v=Math.max(0,Math.floor(Number(e.target.value)||0));
    if(!db.qty[webTenantId][pid])db.qty[webTenantId][pid]={};
    if(v)db.qty[webTenantId][pid][uid]=v;else delete db.qty[webTenantId][pid][uid];
    delete (db.final[webTenantId]||{})[pid];
    save();renderWeb();
  }));
  document.querySelectorAll('[data-extra]').forEach(inp=>inp.addEventListener('change',e=>{
    const pid=e.target.dataset.extra;
    const v=Math.max(0,Math.floor(Number(e.target.value)||0));
    if(!db.extra[webTenantId])db.extra[webTenantId]={};
    db.extra[webTenantId][pid]=v;delete (db.final[webTenantId]||{})[pid];
    save();renderWeb();
  }));
  document.querySelectorAll('[data-final]').forEach(inp=>inp.addEventListener('change',e=>{
    const pid=e.target.dataset.final;
    const v=Number(e.target.value);
    if(!Number.isInteger(v)||v<0){toast('最终下单必须是非负整数（整箱）');renderWeb();return;}
    if(!db.final[webTenantId])db.final[webTenantId]={};
    db.final[webTenantId][pid]=v;save();renderWeb();
  }));

function confirmImport(){
  const tid=webTenantId;let n=0;
  IMPORT_NEW.forEach(x=>{
    if(x.verdict)return;
    if(productsOf(tid).find(p=>p.barcode===x.barcode&&p.channel===x.channel))return;
    productsOf(tid).push({id:'p'+Date.now()+n,barcode:x.barcode,name:x.name,spec:x.spec,channel:x.channel,price:x.price,yonghui:x.yonghui||'',status:'on'});
    n++;
  });
  save();hideModal();renderWeb();toast(`导入完成：${db.tenants[tid].name} 新增 ${n} 个商品行，小程序端已同步`);
}
function saveNewRow(){
  const name=$('#nName').value.trim(),price=parseFloat($('#nPrice').value),spec=parseInt($('#nSpec').value,10);
  const barcode=$('#nBarcode').value.trim(),channel=$('#nChannel').value;
  if(!name){toast('请填写商品简称');return;}
  if(!(price>0)){toast('请填写单价');return;}
  if(!(spec>0)){toast('请填写每箱件数（规格）');return;}
  productsOf(webTenantId).push({id:'p'+Date.now(),barcode:barcode||'',name,spec,channel,price,yonghui:'',status:'on'});
  webAdding=false;save();renderWeb();toast(`已新增「${name}（${channel}下单）」，小程序端同步可见`);
}

function tickMCountdown(){
  const cd=$('#mCd');if(!cd)return;
  if(session.closed){cd.textContent='已截止';return;}
  const diff=session.deadline-Date.now();
  if(diff<=0){session.closed=true;save();renderMobileApp();return;}
  const h=Math.floor(diff/3600000),m=Math.floor(diff%3600000/60000),s=Math.floor(diff%60000/1000);
  cd.textContent=`今日 18:00 · 剩 ${h}时${String(m).padStart(2,'0')}分${String(s).padStart(2,'0')}秒`;
}
setInterval(()=>{if(mode==='mobile'&&session&&session.view==='fill')tickMCountdown();},1000);
function mSubmit(){
  if(session.closed){mToast('本批次已截止');return;}
  const cart=session.cart||{};
  const items=Object.entries(cart).filter(([,v])=>v>0);
  if(!items.length){mToast('请先填写报单数量');return;}
  const uid=session.userId,tid=session.tenantId;
  let total=0;
  items.forEach(([pid,v])=>{
    if(!db.qty[tid][pid])db.qty[tid][pid]={};
    db.qty[tid][pid][uid]=(db.qty[tid][pid][uid]||0)+Number(v);
    delete (db.final[tid]||{})[pid];
    total+=Number(v);
  });
  if(!db.subs[tid])db.subs[tid]=[];
  const now=new Date();
  db.subs[tid].push({personId:uid,time:`今日 ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`,count:total,
    items:items.map(([pid,v])=>({pid,qty:Number(v)})),status:'预报中'});
  session.cart={};save();renderMobileApp();
  showPhoneModal(`
    <div class="ok">✓</div>
    <h4>预报提交成功</h4>
    <p><b>${currentUser().name}</b> 已报 <b>${fmt0(total)} 件</b>（${items.length} 个商品）<br>
    已同步到管理端汇总表对应报单列<br>价格与金额由管理端统一核算</p>
    <button class="btn btn-primary" data-act="m-modal-close">查看我的提交</button>`);
}

/* ================= 全局事件 ================= */
document.querySelectorAll('.mode-sw button').forEach(b=>b.addEventListener('click',()=>{
  mode=b.dataset.mode;
  $('#modeWeb').classList.toggle('on',mode==='web');
  $('#modeMobile').classList.toggle('on',mode==='mobile');
  save();render();
}));
$('#webTenantSel').addEventListener('change',e=>{webTenantId=e.target.value;save();if(mode==='web')renderWeb();});
$('#demoSwitch').addEventListener('change',e=>{
  const v=e.target.value;
  if(v==='logout'){session=null;authScreen='login';}
  else{
    let tid=null;
    Object.values(db.tenants).forEach(t=>{if(t.members.find(m=>m.userId===v))tid=t.id;});
    if(!tid){toast('该用户不属于任何租户');render();return;}
    session={userId:v,tenantId:tid,view:'fill',cart:{},closed:false,deadline:Date.now()+5*3600000+23*60000,_kw:''};
  }
  save();render();
});

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act],[data-mtab],[data-mfav],[data-minc],[data-mdec],[data-mdel],[data-mrole],[data-mdelmember],[data-mplan]');
  if(!el)return;
  if(el.dataset.mtab){session.view=el.dataset.mtab;save();renderMobileApp();$('#mView').scrollTop=0;return;}
  if(el.dataset.mfav){
    if(session.closed){mToast('本批次已截止');return;}
    const id=el.dataset.mfav;session.cart[id]=(session.cart[id]||0)+1;save();renderMobileApp();
    const p=productsOf(session.tenantId).find(x=>x.id===id);mToast(`已加入：${p.name} +1 件`);return;
  }
  if(el.dataset.minc){session.cart[el.dataset.minc]=(session.cart[el.dataset.minc]||0)+1;save();renderMobileApp();return;}
  if(el.dataset.mdec){const id=el.dataset.mdec;const v=(session.cart[id]||0)-1;if(v>0)session.cart[id]=v;else delete session.cart[id];save();renderMobileApp();return;}
  if(el.dataset.mdel){delete session.cart[el.dataset.mdel];save();renderMobileApp();return;}
  if(el.dataset.mrole){
    const i=+el.dataset.mrole;currentTenant().members[i].role=el.value;save();renderMobileApp();
    toast(`角色已更新为「${ROLE_LABELS[el.value]}」`);return;
  }
  if(el.dataset.mdelmember!==undefined){
    const i=+el.dataset.mdelmember;
    const t=currentTenant();
    if(t.members[i].userId===session.userId){mToast('不能移除自己');return;}
    t.members.splice(i,1);save();renderMobileApp();mToast('成员已移除');return;
  }
  if(el.dataset.mplan){
    const key=el.dataset.mplan,t=currentTenant();
    if(t.plan===key){mToast('当前已是该套餐');return;}
    const p=PLANS.find(x=>x.key===key);
    showPhoneModal(`<div class="ok">✓</div><h4>${p.price?'升级':'切换'}到${p.name}</h4>
      <p>${p.price?`¥${p.price}/月 · ${p.features[0]}`:'切换到免费体验版'}<br>演示模式：直接生效</p>
      <button class="btn btn-primary" data-act="confirm-plan" data-plan="${key}">确认</button>`);
    return;
  }
  const act=el.dataset.act;
  if(!act)return;
  /* --- 认证 --- */
  if(act==='send-sms'){mToast('演示模式：验证码 888888');return;}
  if(act==='do-login'){
    const phone=($('#authPhone')?.value||'').trim();
    if(!phone||phone.length<11){mToast('请输入正确的手机号');return;}
    let uid=null;
    Object.values(db.users).forEach(u=>{if((u.phone||'').slice(-4)===phone.slice(-4))uid=u.id;});
    if(!uid){
      authScreen='register';regStep=2;regData={phone,name:''};render();mToast('未找到所属公司，请注册新公司');return;
    }
    let tid=null;
    Object.values(db.tenants).forEach(t=>{if(t.members.find(m=>m.userId===uid))tid=t.id;});
    if(!tid){authScreen='register';regStep=2;regData={phone,name:db.users[uid].name};render();return;}
    session={userId:uid,tenantId:tid,view:'fill',cart:{},closed:false,deadline:Date.now()+5*3600000+23*60000,_kw:''};
    save();render();mToast(`欢迎回来，${db.users[uid].name}`);return;
  }
  if(act==='quick-login'){
    const uid=el.dataset.uid;let tid=null;
    Object.values(db.tenants).forEach(t=>{if(t.members.find(m=>m.userId===uid))tid=t.id;});
    session={userId:uid,tenantId:tid,view:'fill',cart:{},closed:false,deadline:Date.now()+5*3600000+23*60000,_kw:''};
    save();render();mToast(`以 ${db.users[uid].name} 身份进入 ${db.tenants[tid].name}`);return;
  }
  if(act==='show-register'){authScreen='register';regStep=1;regData={};render();return;}
  if(act==='back-to-login'){authScreen='login';render();return;}
  if(act==='reg-next'){
    if(regStep===1){
      const phone=($('#regPhone')?.value||'').trim(),code=($('#regCode')?.value||'').trim();
      if(!phone||phone.length<11){mToast('请输入正确手机号');return;}
      if(code!=='888888'){mToast('验证码错误（演示：888888）');return;}
      regData.phone=phone;regData.code=code;regStep=2;render();return;
    }
    if(regStep===2){
      const company=($('#regCompany')?.value||'').trim(),name=($('#regName')?.value||'').trim(),brand=$('#regBrand')?.value;
      if(!company){mToast('请输入公司名称');return;}
      if(!name){mToast('请输入联系人姓名');return;}
      const invCode=Math.random().toString(36).slice(2,8).toUpperCase();
      regData={...regData,company,name,brand,inviteCode:invCode};
      const tid='t'+(db.nextTenantId++),uid='u'+(db.nextUserId++);
      db.users[uid]={id:uid,name,phone:regData.phone.slice(0,3)+'****'+regData.phone.slice(-4)};
      db.tenants[tid]={id:tid,name:company,contact:name,plan:'free',inviteCode:invCode,members:[{userId:uid,name,role:'admin'}]};
      db.products[tid]=[];db.qty[tid]={};db.subs[tid]=[];
      regData._newUid=uid;regData._newTid=tid;
      regStep=3;render();return;
    }
    return;
  }
  if(act==='reg-prev'){regStep=Math.max(1,regStep-1);render();return;}
  if(act==='reg-finish'){
    session={userId:regData._newUid,tenantId:regData._newTid,view:'fill',cart:{},closed:false,deadline:Date.now()+5*3600000+23*60000,_kw:''};
    webTenantId=regData._newTid;authScreen='login';save();render();
    toast(`欢迎！${regData.company} 已创建，先到 Web 端导入商品`);return;
  }
  /* --- 小程序 --- */
  if(act==='logout'){session=null;authScreen='login';save();render();return;}
  if(act==='m-toggle-closed'){session.closed=!session.closed;save();renderMobileApp();mToast(session.closed?'已模拟批次截止':'批次已重新开放');return;}
  if(act==='m-submit'){mSubmit();return;}
  if(act==='m-modal-close'){hideModal();session.view='mine';save();renderMobileApp();return;}
  if(act==='copy-invite'){
    const code=currentTenant()?.inviteCode||'';
    const text=`我在「${currentTenant()?.name}」使用低温奶预报单系统，邀请码 ${code}，快来加入。`;
    if(navigator.clipboard?.writeText)navigator.clipboard.writeText(text).then(()=>mToast('邀请文案已复制')).catch(()=>mToast('邀请码：'+code));
    else mToast('邀请码：'+code);
    return;
  }
  if(act==='add-demo-member'){
    const names=['赵磊','孙丽','周洋','吴涛','郑雪','马超'];
    const roles=['filler','filler','clerk','distributor','filler','filler'];
    const ti=Math.floor(Math.random()*names.length);
    const t=currentTenant();
    const plan=PLANS.find(p=>p.key===t.plan);
    const fillerCount=t.members.filter(m=>m.role!=='admin').length;
    if(fillerCount>=plan.maxFillers){mToast(`已达${plan.name}上限（${plan.maxFillers}人），请升级套餐`);return;}
    const uid='u'+(db.nextUserId++),nm=names[ti];
    db.users[uid]={id:uid,name:nm,phone:'1****'+String(Math.floor(Math.random()*9000+1000))};
    t.members.push({userId:uid,name:nm,role:roles[ti],store:roles[ti]==='distributor'});
    save();renderMobileApp();mToast(`${nm}（${ROLE_LABELS[roles[ti]]}）已加入`);return;
  }
  if(act==='confirm-plan'){
    currentTenant().plan=el.dataset.plan;
    hideModal();save();renderMobileApp();mToast('套餐已更新');return;
  }
  if(act==='reset-all'){
    if(confirm('重置所有演示数据？')){localStorage.removeItem(LS);location.reload();}
    return;
  }
  /* --- Web --- */
  if(act==='close-modal'){hideModal();return;}
  if(act==='open-import'){openImport();return;}
  if(act==='confirm-import'){confirmImport();return;}
  if(act==='add-row'){webAdding=true;renderWeb();setTimeout(()=>$('#nName')?.focus(),50);return;}
  if(act==='add-row-cancel'){webAdding=false;renderWeb();return;}
  if(act==='add-row-save'){saveNewRow();return;}
  if(act==='disable'){
    const p=productOf(el.dataset.id);p.status='off';save();renderWeb();
    toast(`「${p.name}（${p.channel}）」已停用，小程序端不再显示；历史批次数据保留`);return;
  }
  if(act==='enable'){
    const p=productOf(el.dataset.id);p.status='on';save();renderWeb();toast(`「${p.name}」已重新启用`);return;
  }
});

/* ================= 启动 ================= */
load();
$('#modeWeb').classList.toggle('on',mode==='web');
$('#modeMobile').classList.toggle('on',mode==='mobile');
render();
</script>
</body>
</html>
