<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7" id="meta-theme-color">
<style>
/* v623（2026-10-19）：阿里云备案信息核查（2026-10-22 17:00 截止）点名 hergent.cn
   「网站底部未显示正确备案编号或编号上链接未指向工信部网页」。
   SPA 的 #app 是 100vh 全屏布局 ⇒ 这个静态 footer 自然落在视口外，
   但**网页源码里可见**（核查机器人抓 HTML 源码即命中，无需执行 JS）；
   登录页 Login.vue 底部、legal 两个静态页、登录后主界面侧栏底部（Shell.vue .sb-beian）
   另有可见的三份。备案号 = 鄂ICP备2026027973号-1（阿里云核查邮件表格所列即此号）。 */
.beian-ft{padding:6px 0;text-align:center;font-size:11px;line-height:1.6;color:#999;background:#fff}
.beian-ft a{color:inherit;text-decoration:none}
</style>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/favicon.svg">
<title>Hergent · AI 经营副驾</title>
<script>
/* 无闪烁主题：默认浅色，深色可选 */
(function(){
  var t=localStorage.getItem('hergent_theme');
  if(t!=='light'&&t!=='dark'){t='light';}
  var de=document.documentElement;
  de.classList.remove('light','dark');
  de.classList.add(t);
  /* v321：浏览器 UI 配色随主题走（移动端地址栏/状态栏此前恒为浅色 #f5f5f7）。
     切换主题的执行者是 store.setTheme（只改 <html> 的 class）⇒ 这里监听 class 变化同步，
     从而**不必改动 store/index.js**（该文件当时有并行会话的在途改动）。 */
  function syncThemeColor(){
    var mc=document.getElementById('meta-theme-color');
    if(mc){mc.setAttribute('content', de.classList.contains('dark')?'#1c1c1e':'#f5f5f7');}
  }
  syncThemeColor();
  new MutationObserver(syncThemeColor).observe(de,{attributes:true,attributeFilter:['class']});
})();
</script>
</head>
<body>
<div id="app"></div>
<footer class="beian-ft"><a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">鄂ICP备2026027973号-1</a></footer>
<script type="module" src="/src/main.js"></script>
</body>
</html>
